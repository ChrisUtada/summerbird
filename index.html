<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>凤尾庄 · 暗途 — 完整修复版</title>
    <style>
        /* 完整样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0a0a;
            color: #ddd2c2;
            font-family: 'Georgia', 'SimSun', 'Songti SC', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
            transition: background 1.2s ease;
        }
        /* 天气背景层（位于 #app 之后） */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }
        body.bg-cloudy .bg-layer {
            background:
                radial-gradient(ellipse 120% 70% at 50% -10%, #2a2a30 0%, #17171c 45%, #0b0b0e 100%);
        }
        body.bg-night .bg-layer {
            background:
                radial-gradient(ellipse 130% 80% at 50% -20%, #0e1220 0%, #070a12 50%, #020308 100%);
        }
        body.bg-rain .bg-layer {
            background:
                linear-gradient(180deg, #232a33 0%, #141a22 55%, #0b0f15 100%);
        }
        /* 雨天：canvas 随机粒子雨（见 JS 粒子引擎） */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        body.bg-rain #particleCanvas {
            opacity: 1;
        }
        .bg-fog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        body.bg-rain .bg-fog {
            opacity: 0.5;
            background:
                radial-gradient(ellipse 90% 50% at 50% 90%, rgba(190, 210, 230, 0.16) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 20% 70%, rgba(170, 190, 215, 0.10) 0%, transparent 70%);
            animation: fogDrift 9s ease-in-out infinite alternate;
        }
        @keyframes fogDrift {
            from {
                transform: translateX(-2%);
            }
            to {
                transform: translateX(2%);
            }
        }
        /* ---------- 书本外壳（32 开：单页宽:高 ≈ 0.71，摊开两页 + 书脊） ---------- */
        #app {
            --page-h: min(94vh, 940px);
            width: fit-content;
            height: var(--page-h);
            background: linear-gradient(180deg, #1d1712, #14100c);
            border: 1px solid #2e2820;
            border-radius: 4px 16px 16px 4px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.72), 0 6px 18px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a332b;
            padding: 12px 22px 10px;
            flex-wrap: wrap;
            gap: 6px;
            background: linear-gradient(180deg, #1e1812, #17120d);
        }
        .game-title {
            font-size: 20px;
            letter-spacing: 6px;
            color: #bfae95;
        }
        .game-title span {
            color: #d65a3c;
            font-weight: bold;
        }
        .status-bar {
            font-size: 13px;
            color: #a8977d;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .status-bar .badge {
            background: #1f1a16;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid #3a322a;
            color: #c2b4a0;
        }
        .status-bar .badge .num {
            color: #f0c060;
        }
        .btn-drawer {
            background: #241e17;
            border: 1px solid #3a322a;
            color: #c2b4a0;
            padding: 3px 16px 10px;
            border-radius: 3px 3px 0 0;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%);
            transition: all 0.2s;
        }
        .btn-drawer .num {
            color: #f0c060;
        }
        .btn-drawer:hover {
            border-color: #d65a3c;
            color: #f0e6d4;
            transform: translateY(-1px);
        }
        .btn-drawer.active {
            background: #d65a3c;
            border-color: #e07050;
            color: #fff6ea;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
            transform: translateY(-2px);
        }
        .btn-drawer.active .num {
            color: #ffe9a8;
        }
        .btn-history {
            background: #2a241d;
            border: 1px solid #4a4034;
            color: #d8cbb4;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-history:hover {
            border-color: #d65a3c;
            color: #f0e6d4;
        }
        .main-layout {
            display: flex;
            gap: 0;
            flex: 1;
            min-height: 0;
        }
        /* 左页：剧情 */
        .story-column {
            width: calc(var(--page-h) * 0.71);
            min-width: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 12px 0 22px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }
        .story-area {
            flex: 1;
            min-height: 0;
            background: linear-gradient(180deg, #1c1712, #16110d);
            padding: 30px 36px 52px;
            overflow: hidden;
            line-height: 1.9;
            font-size: 15px;
            color: #e6dccb;
            position: relative;
            cursor: pointer;
            transition: opacity 0.32s ease;
        }
        .story-hint {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #8d7c64;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
        }
        .story-area.story-fade-out {
            opacity: 0;
        }
        .story-area.story-fade-in {
            animation: storyFadeIn 0.5s ease;
        }
        @keyframes storyFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .chapter-title {
            text-align: center;
            font-size: 19px;
            color: #f0c060;
            letter-spacing: 5px;
            margin: 14px 0 20px;
            border-bottom: 1px solid #3a332b;
            padding-bottom: 12px;
        }
        .story-area::-webkit-scrollbar {
            width: 4px;
        }
        .story-area::-webkit-scrollbar-track {
            background: #12100e;
        }
        .story-area::-webkit-scrollbar-thumb {
            background: #3a322a;
            border-radius: 4px;
        }
        .story-area .narr-line {
            color: #b9ab94;
            margin-bottom: 8px;
        }
        .story-area .divider {
            border: none;
            border-top: 1px solid #3a332b;
            margin: 12px 0;
        }
        .story-area .msg {
            margin-bottom: 8px;
        }
        .story-area .msg .speaker {
            font-weight: bold;
            margin-right: 6px;
        }
        .story-area .msg .speaker.wu {
            color: #a8ccdd;
        }
        .story-area .msg .speaker.shan {
            color: #d8b48e;
        }
        .story-area .msg .speaker.old {
            color: #c0b090;
        }
        .story-area .msg .speaker.zhang {
            color: #cfbd90;
        }
        .story-area .msg .text {
            display: inline;
        }
        .clue-highlight {
            color: #e8b84a;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 2px dashed #b5432a;
            padding: 0 3px;
            transition: background 0.2s;
        }
        .clue-highlight:hover {
            background: #3a2a1a;
            border-bottom-color: #e8b84a;
        }
        .note-highlight {
            color: #8fd0c0;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 2px dashed #2f7d6a;
            padding: 0 3px;
            transition: background 0.2s;
        }
        .note-highlight:hover {
            background: #12312a;
            border-bottom-color: #8fd0c0;
        }
        .note-highlight.locked {
            color: inherit;
            font-weight: normal;
            cursor: default;
            border-bottom: none;
            padding: 0;
        }
        .note-highlight.locked:hover {
            background: none;
        }
        .char-highlight {
            color: #d8a8f0;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 2px dashed #8a5ab0;
            padding: 0 3px;
            transition: background 0.2s;
        }
        .char-highlight:hover {
            background: #2a1a3a;
            border-bottom-color: #d8a8f0;
        }
        .note-pop {
            position: fixed;
            z-index: 1200;
            max-width: 320px;
            background: #1d1a14;
            border: 1px solid #2f7d6a;
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .note-pop .note-pop-title {
            color: #8fd0c0;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            padding-bottom: 5px;
            border-bottom: 1px solid #2a4a40;
        }
        .note-pop .note-pop-body {
            color: #d8ccb8;
            font-size: 13px;
            line-height: 1.8;
        }
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            width: 90%;
            max-width: 680px;
            max-height: 80vh;
            background: #1a1613;
            border: 1px solid #3a332b;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 线索选择弹窗：无滚动条，两列网格自适应 */
        #clueModalMask .modal-box {
            max-height: none;
            max-width: 560px;
        }
        #clueModalBody {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            overflow: visible;
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-bottom: 1px solid #3a332b;
            color: #e8decc;
            font-size: 15px;
            letter-spacing: 2px;
            flex-shrink: 0;
        }
        .modal-close {
            background: #2a241d;
            border: 1px solid #5a4a32;
            color: #f0c060;
            padding: 4px 16px;
            border-radius: 16px;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .modal-close:hover {
            border-color: #d65a3c;
            color: #faf4ea;
            background: #d65a3c;
        }
        .modal-body {
            padding: 16px 20px;
            overflow-y: auto;
            line-height: 1.9;
            font-size: 14px;
            color: #d4c8b8;
        }
        .modal-body .hist-line {
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 2px solid #3a332b;
        }
        .modal-body .hist-line .hist-who {
            font-size: 12px;
            color: #8a7b64;
            margin-bottom: 2px;
        }
        /* 线索选择弹窗 */
        .modal-clue {
            background: #201b16;
            border: 1px solid #3a332b;
            border-left: 3px solid #8fae74;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-clue:hover {
            border-color: #d65a3c;
            background: #2a241d;
        }
        .modal-clue.selected {
            border-color: #f0c060;
            border-left-color: #f0c060;
            background: #3a2e14;
        }
        .modal-clue .modal-clue-name {
            font-size: 14px;
            color: #e8decc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-clue .modal-clue-desc {
            font-size: 12px;
            color: #a39680;
            line-height: 1.6;
            margin-top: 3px;
        }
        .slot {
            display: inline-block;
            min-width: 100px;
            min-height: 28px;
            border-bottom: 3px dashed #5a7050;
            margin: 0 4px;
            padding: 0 6px;
            color: #93a980;
            font-size: 14px;
            vertical-align: bottom;
            transition: all 0.3s;
            background: rgba(30, 44, 30, 0.35);
            border-radius: 0 0 4px 4px;
            cursor: default;
        }
        .slot .placeholder {
            color: #6d8058;
            font-size: 12px;
        }
        .slot.filled {
            border-bottom: 3px solid #e8b84a;
            color: #e8b84a;
            font-style: normal;
            background: rgba(232, 184, 74, 0.08);
        }
        .slot .slot-content {
            display: inline-block;
        }
        .slot.drag-over {
            border-bottom-color: #b5432a;
            background: rgba(181, 67, 42, 0.2);
        }
        .slot.correct-flash {
            animation: flashGreen 0.6s ease;
        }
        @keyframes flashGreen {
            0%,
            100% {
                background: rgba(232, 184, 74, 0.08);
            }
            50% {
                background: rgba(74, 200, 100, 0.25);
            }
        }
        .slot.wrong-flash {
            animation: flashRed 0.5s ease;
        }
        @keyframes flashRed {
            0%,
            100% {
                background: rgba(20, 30, 20, 0.25);
            }
            50% {
                background: rgba(200, 50, 50, 0.25);
            }
        }
        /* ---------- 右页：抽屉（推理 / 物品 / 人物） ---------- */
        .drawer {
            flex: 0 0 0;
            min-width: 0;
            background: linear-gradient(180deg, #1b1611, #150f0b);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 14px 0 22px rgba(0, 0, 0, 0.55), inset 2px 0 0 #0d0a08;
            transition: flex-basis 0.28s ease;
        }
        .drawer.open {
            flex-basis: calc(var(--page-h) * 0.71);
        }
        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 12px;
            border-bottom: 1px solid #3a332b;
            font-size: 14px;
            color: #d65a3c;
            letter-spacing: 3px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #1e1812, #17120d);
        }
        .drawer-close {
            background: none;
            border: none;
            color: #9a8b72;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            font-family: inherit;
        }
        .drawer-close:hover {
            color: #f0e6d4;
        }
        .drawer-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .drawer-sec {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            padding: 16px 20px 20px;
            overflow: hidden;
        }
        .drawer-sec.active {
            display: flex;
        }
        /* 抽屉内列表两栏排布（书页宽度下卡片更紧凑） */
        #clueList,
        #itemList,
        #charList {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-content: start;
            min-height: 0;
        }
        #clueList .drag-block,
        #itemList .drag-block,
        #charList .drag-block {
            margin-bottom: 0;
        }
        #clueList .empty,
        #itemList .empty,
        #charList .empty {
            grid-column: 1 / -1;
        }
        .drawer::-webkit-scrollbar {
            width: 4px;
        }
        .drawer::-webkit-scrollbar-track {
            background: #12100e;
        }
        .drawer::-webkit-scrollbar-thumb {
            background: #3a322a;
            border-radius: 4px;
        }
        .filter-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .filter-tabs button {
            background: #241f1a;
            border: 1px solid #3a332b;
            color: #a8977d;
            padding: 3px 14px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .filter-tabs button:hover {
            border-color: #5a4a32;
            color: #d8cbb4;
        }
        .filter-tabs button.active {
            background: #d65a3c;
            border-color: #d65a3c;
            color: #faf4ea;
        }
        .filter-tabs button .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .filter-tabs button .dot.wu {
            background: #8ab0c0;
        }
        .filter-tabs button .dot.shan {
            background: #c0a080;
        }
        .drawer .empty {
            color: #8a7b64;
            font-size: 13px;
            padding: 10px 0;
            text-align: center;
        }
        .drag-block {
            background: #262019;
            border: 1px solid #4a4034;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-size: 16px;
            color: #efe6d6;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 10px;
        }
        .drag-block:hover {
            border-color: #d65a3c;
            background: #322a21;
        }
        .drag-block:active {
            cursor: grabbing;
        }
        .drag-block.dragging {
            opacity: 0.4;
        }
        .drag-block .block-label {
            font-size: 13px;
            color: #c2ae8c;
            margin-right: 2px;
        }
        .drag-block .block-type {
            font-size: 12px;
            color: #9cc080;
            border: 1px solid #3c5344;
            padding: 0 8px;
            border-radius: 10px;
            font-weight: normal;
        }
        .drag-block .block-detail {
            font-size: 14px;
            line-height: 1.8;
            color: #c0b29c;
            width: 100%;
            padding-left: 4px;
            margin-top: 4px;
        }
        .drag-block .owner-tag {
            font-size: 12px;
            padding: 0 8px;
            border-radius: 10px;
            background: #3a322a;
            color: #b3a287;
        }
        .drag-block .owner-tag.wu {
            background: #1e3038;
            color: #a8ccdd;
            border: 1px solid #3a5a68;
        }
        .drag-block .owner-tag.shan {
            background: #382a18;
            color: #d8b48e;
            border: 1px solid #68502c;
        }
        .drag-block .owner-tag.all {
            background: #2c2620;
            color: #c9bb9f;
            border: 1px solid #4a4034;
        }
        .drag-block.used {
            opacity: 0.25;
            cursor: default;
            border-color: #1a1a1a;
            pointer-events: none;
        }
        .drag-block.selectable {
            cursor: pointer;
        }
        .drag-block.selected {
            border-color: #f0c060;
            background: #3a2e14;
        }
        .char-card {
            background: #211c17;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            border-left: 3px solid #d65a3c;
        }
        .char-card .cname {
            color: #e8decc;
            font-weight: bold;
            font-size: 14px;
        }
        .char-card .crole {
            color: #9a8b72;
            font-size: 11px;
            margin-left: 6px;
        }
        .char-card .cdesc {
            color: #b3a58f;
            font-size: 12px;
            margin-top: 2px;
        }
        .char-card .cinfo {
            color: #94856e;
            font-size: 11px;
            margin-top: 1px;
        }
        .char-card .unlock-story {
            color: #f0c060;
            font-size: 12px;
            margin-top: 3px;
            padding: 3px 8px;
            background: #2a2210;
            border-radius: 4px;
            border-left: 2px solid #f0c060;
        }
        .note-item {
            padding: 4px 0;
            border-bottom: 1px solid #262019;
        }
        .note-item .note-title {
            color: #e8decc;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .note-item .note-title:hover {
            color: #f0c060;
        }
        .note-item .note-detail {
            display: none;
            font-size: 13px;
            line-height: 1.6;
            color: #c0b29c;
            padding: 6px 10px;
            background: #211c17;
            border-radius: 6px;
            margin-top: 4px;
            border-left: 2px solid #5a7050;
        }
        .note-item .note-detail.open {
            display: block;
        }
        .note-item .note-toggle {
            color: #9a8b72;
            font-size: 12px;
            margin-left: 6px;
        }
        .combine-area {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #2a2420;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .combine-area .info {
            font-size: 12px;
            color: #a8977d;
            flex: 1;
        }
        .combine-area .btn-combine {
            background: #d65a3c;
            border: none;
            color: #faf4ea;
            padding: 4px 16px;

        /* 推理框：组合槽位 */

        .combo-slot:hover {

        .combo-slot.filled {

        .combo-slot .combo-slot-empty {

        .combo-slot .combo-slot-x {

            font-size: 11px;

        }
        .combo-slot.filled:hover .combo-slot-x {

            opacity: 1;
        }
        .combo-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-shrink: 0;
        }
        .combo-btns .btn-combine {
            flex: 1;
            background: #d65a3c;
            border: none;
            color: #faf4ea;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .combo-btns .btn-combine:hover {
            background: #e06a48;
        }
        .combo-btns .btn-combine:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .combo-btns .btn-clear {
            background: #2a2420;
            border: 1px solid #4a4034;
            color: #b3a287;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .combo-btns .btn-clear:hover {
            border-color: #d65a3c;

        /* 窄屏（<1000px）：放弃书本比例，单列堆叠，抽屉占满一行 */
        @media (max-width: 999px) {
            body {
                align-items: flex-start;

            #app {
                --page-h: auto;

</head>
<body class="bg-cloudy">

    <canvas id="particleCanvas"></canvas>
    <div class="bg-fog"></div>

    <div id="app">
        <!-- 顶栏 -->
        <div class="top-bar">
            <div class="game-title">凤尾庄 · <span>暗途</span></div>
            <div class="status-bar">
                <span class="badge">已填 <span class="num" id="fillCount">0</span>/<span class="num" id="totalSlots">0</span></span>
                <button class="btn-drawer" data-drawer="reason" data-title="推理">
                    推理 <span class="num" id="reasonCount">0</span>
                </button>
                <button class="btn-drawer" data-drawer="item" data-title="物品">
                    物品 <span class="num" id="itemCountBadge">0</span>
                </button>
                <button class="btn-drawer" data-drawer="char" data-title="人物">

                </button>
                <button class="btn-history" id="historyBtn">回看</button>
            </div>
        </div>

        <!-- 主布局 -->
        <div class="main-layout">
            <!-- 中栏：剧情 -->
            <div class="story-column">
                <div class="story-area" id="storyArea">
                    <div class="narr-line">✦ 点击高亮词收集线索与物品 · 点击蓝绿词查看笔记 · 点击空白处推进剧情 ✦</div>
                    <div class="story-hint" id="storyHint">▾ 点击空白处推进剧情</div>
                </div>
            </div>

            <!-- 右侧抽屉：推理 / 物品 / 人物 -->
            <aside class="drawer" id="drawer">
                <div class="drawer-head">
                    <span id="drawerTitle">推理</span>
                    <button class="drawer-close" id="drawerClose">×</button>
                </div>
                <div class="drawer-body">
                    <div class="drawer-sec" id="drawerSecReason">
                        <div class="combo-slots" id="comboSlots"></div>
                        <div class="combo-btns">
                            <button class="btn-combine" id="combineBtn" disabled>组合推理</button>
                            <button class="btn-clear" id="clearSelection">清空</button>
                        </div>
                        <div class="reason-title">推理结果 <span class="count" id="reasonTitleCount">(0)</span></div>
                        <div id="clueList" style="flex:1; overflow-y:auto;"></div>
                    </div>
                    <div class="drawer-sec" id="drawerSecItem">
                        <div id="itemList" style="flex:1; overflow-y:auto;"></div>
                    </div>
                    <div class="drawer-sec" id="drawerSecChar">
                        <div id="charList" style="flex:1; overflow-y:auto;"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 线索选择弹窗 -->
    <div class="modal-mask" id="clueModalMask" style="display:none;">
        <div class="modal-box">
            <div class="modal-head">
                <span>选择线索</span>
                <button class="modal-close" id="clueModalClose">关闭</button>
            </div>
            <div class="modal-body" id="clueModalBody"></div>
        </div>
    </div>

    <!-- 笔记悬浮窗 -->
    <div class="note-pop" id="notePop" style="display:none;">
        <div class="note-pop-title" id="notePopTitle"></div>
        <div class="note-pop-body" id="notePopBody"></div>
    </div>

    <!-- 剧情回顾弹窗 -->
    <div class="modal-mask" id="historyMask" style="display:none;">
        <div class="modal-box">
            <div class="modal-head">
                <span>剧情回顾</span>
                <button class="modal-close" id="historyClose">关闭</button>
            </div>
            <div class="modal-body" id="historyBody"></div>
        </div>
    </div>

    <script src="compiler.js"></script>
    <script src="story.js"></script>
    <script>
        // ============================================================
        //  完整修复版 – 所有功能正常，拖拽使用事件委托
        //  内容已迁移至 story.js（compiler.js 负责剧本 DSL 编译）
        // ============================================================

        // ---------- 状态 ----------
        const state = {
            scene: 'wu_start',
            clues: [], // 收集的线索 { id, owner }
            items: [], // 收集的物品 { id, owner }
            notes: [], // 已解锁的笔记 { id, owner }
            characters: [],
            usedBlockIds: new Set(),
            allBlocks: [], // 所有可拖动块
            selectedClueIds: [], // 选中的线索块ID（用于组合）
            slotConfigs: [],
            totalSlots: 0,
        };

        // ---------- 数据（内容全部来自 story.js，剧本经 compiler.js 编译） ----------
        const STORY = window.__STORY__ || {};
        const DATA = STORY.data || { clues: {}, items: {}, notes: {}, characters: {} };
        const COMBINATIONS = STORY.combinations || {};
        const COMPILED = SBCompiler.compileScenes(STORY.scenes || [], {
            speakers: STORY.speakers || {},
            ids: {
                char: DATA.characters,
                clue: Object.assign({}, DATA.clues, DATA.items),
                note: DATA.notes
            }
        });
        const SCENES = COMPILED.scenes;

        // ---------- DOM 引用 ----------
        const app = document.getElementById('app');
        const storyEl = document.getElementById('storyArea');
        const storyHint = document.getElementById('storyHint');
        const clueList = document.getElementById('clueList');
        const charList = document.getElementById('charList');
        const fillCount = document.getElementById('fillCount');
        const totalSlots = document.getElementById('totalSlots');
        const reasonCount = document.getElementById('reasonCount');
        const charCountBadge = document.getElementById('charCountBadge');
        const itemList = document.getElementById('itemList');
        const itemCountBadge = document.getElementById('itemCountBadge');
        const combineBtn = document.getElementById('combineBtn');
        const clearSelectionBtn = document.getElementById('clearSelection');
        const toast = document.getElementById('toast');
        const notePop = document.getElementById('notePop');
        const notePopTitle = document.getElementById('notePopTitle');
        const notePopBody = document.getElementById('notePopBody');
        const historyMask = document.getElementById('historyMask');
        const historyBody = document.getElementById('historyBody');
        const historyBtn = document.getElementById('historyBtn');
        const historyClose = document.getElementById('historyClose');
        const clueModalMask = document.getElementById('clueModalMask');
        const clueModalBody = document.getElementById('clueModalBody');
        const clueModalClose = document.getElementById('clueModalClose');
        const comboSlots = document.getElementById('comboSlots');
        const reasonTitleCount = document.getElementById('reasonTitleCount');
        const drawer = document.getElementById('drawer');
        const drawerTitle = document.getElementById('drawerTitle');
        const drawerClose = document.getElementById('drawerClose');

        let toastTimer = null;
        let currentSceneOwner = 'wu';

        // ---------- 抽屉切换（推理 / 物品 / 人物，同时只开一个） ----------
        const DRAWER_SECTIONS = {
            reason: 'drawerSecReason',
            item: 'drawerSecItem',
            char: 'drawerSecChar'
        };
        let openDrawer = null;

        function closeDrawer() {
            openDrawer = null;
            drawer.classList.remove('open');
            document.querySelectorAll('.btn-drawer').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.drawer-sec').forEach(s => s.classList.remove('active'));
        }

        function openDrawerByKey(key) {
            const btn = document.querySelector('.btn-drawer[data-drawer="' + key + '"]');
            openDrawer = key;
            drawer.classList.add('open');
            drawerTitle.textContent = (btn && btn.dataset.title) || '面板';
            document.querySelectorAll('.btn-drawer').forEach(b => {
                b.classList.toggle('active', b.dataset.drawer === key);
            });
            document.querySelectorAll('.drawer-sec').forEach(s => {
                s.classList.toggle('active', s.id === DRAWER_SECTIONS[key]);
            });
        }

        function toggleDrawer(key) {
            if (openDrawer === key) closeDrawer();
            else openDrawerByKey(key);
        }

        document.querySelectorAll('.btn-drawer').forEach(btn => {
            btn.addEventListener('click', function() {
                toggleDrawer(this.dataset.drawer);
            });
        });
        drawerClose.addEventListener('click', closeDrawer);

        // ---------- 随机粒子雨引擎（canvas） ----------
        const particleCanvas = document.getElementById('particleCanvas');
        const pctx = particleCanvas.getContext('2d');
        let rainParticles = [];
        let rainRaf = null;
        const RAIN_COUNT = 90;

        function resizeParticles() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }

        function spawnRain() {
            rainParticles = [];
            for (let i = 0; i < RAIN_COUNT; i++) {
                rainParticles.push({
                    x: Math.random() * particleCanvas.width,
                    y: Math.random() * particleCanvas.height,
                    len: 6 + Math.random() * 16,
                    speed: 8 + Math.random() * 10,
                    drift: (Math.random() - 0.5) * 1.6,
                    alpha: 0.12 + Math.random() * 0.35,
                    w: 0.6 + Math.random() * 0.9
                });
            }
        }

        function drawRain() {
            pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            pctx.lineCap = 'round';
            for (const p of rainParticles) {
                pctx.globalAlpha = p.alpha;
                pctx.strokeStyle = '#c8dcf0';
                pctx.lineWidth = p.w;
                pctx.beginPath();
                pctx.moveTo(p.x, p.y);
                pctx.lineTo(p.x + p.drift * 2, p.y + p.len);
                pctx.stroke();
                p.y += p.speed;
                p.x += p.drift;
                if (p.y > particleCanvas.height + p.len) {
                    p.y = -p.len - Math.random() * 40;
                    p.x = Math.random() * particleCanvas.width;
                }
            }
            pctx.globalAlpha = 1;
            rainRaf = requestAnimationFrame(drawRain);
        }

        function startRain() {
            if (rainRaf) return;
            resizeParticles();
            spawnRain();
            rainRaf = requestAnimationFrame(drawRain);
        }

        function stopRain() {
            if (rainRaf) {
                cancelAnimationFrame(rainRaf);
                rainRaf = null;
            }
            pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        }

        window.addEventListener('resize', function() {
            resizeParticles();
            if (rainRaf) spawnRain();
        });

        // ---------- Toast ----------
        function showToast(text, type = '') {
            toast.textContent = text;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ---------- 核心操作 ----------
        function addClue(id, owner) {
            if (state.clues.find(c => c.id === id)) return false;
            if (!DATA.clues[id]) return false;
            const ownerVal = owner || currentSceneOwner || 'wu';
            state.clues.push({ id, owner: ownerVal });
            const blockId = 'clue_' + id;
            if (!state.allBlocks.find(b => b.id === blockId)) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'clue',
                    label: DATA.clues[id].name,
                    detail: DATA.clues[id].desc,
                    sourceId: id,
                    sourceType: 'clue',
                    owner: ownerVal
                });
            }
            renderAll();
            showToast(`已收集线索：${DATA.clues[id].name}`, 'success');
            return true;
        }

        function addItem(id, owner) {
            if (state.items.find(i => i.id === id)) return false;
            if (!DATA.items[id]) return false;
            const ownerVal = owner || currentSceneOwner || 'wu';
            state.items.push({ id, owner: ownerVal });
            const blockId = 'item_' + id;
            if (!state.allBlocks.find(b => b.id === blockId)) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'item',
                    label: DATA.items[id].name,
                    detail: DATA.items[id].desc,
                    sourceId: id,
                    sourceType: 'item',
                    owner: ownerVal
                });
            }
            renderAll();
            showToast(`已收集物品：${DATA.items[id].name}`, 'success');
            return true;
        }

        function addNote(id, owner) {
            if (state.notes.find(n => n.id === id)) return false;
            if (!DATA.notes[id]) return false;
            const ownerVal = owner || currentSceneOwner || 'wu';
            state.notes.push({ id, owner: ownerVal });
            const blockId = 'note_' + id;
            if (!state.allBlocks.find(b => b.id === blockId)) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'note',
                    label: DATA.notes[id].name,
                    detail: DATA.notes[id].detail,
                    sourceId: id,
                    sourceType: 'note',
                    owner: ownerVal
                });
            }
            // 解锁后：剧情中对应的高亮词变为可点击
            storyDom.forEach(div => {
                div.querySelectorAll(`.note-highlight[data-note="${id}"]`).forEach(el => {
                    el.classList.remove('locked');
                });
            });
            renderAll();
            showToast(`解锁笔记：${DATA.notes[id].name}`, 'success');
            return true;
        }

        function unlockChar(id) {
            if (state.characters.includes(id)) return false;
            if (!DATA.characters[id]) return false;
            state.characters.push(id);
            const blockId = 'char_' + id;
            const hasBlock = state.allBlocks.find(b => b.id === blockId) ||
                state.allBlocks.find(b => b.type === 'char' && b.sourceId === id);
            if (!hasBlock) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'char',
                    label: DATA.characters[id].name,
                    detail: DATA.characters[id].desc + ' — ' + DATA.characters[id].info,
                    sourceId: id,
                    sourceType: 'char',
                    owner: 'all'
                });
            }
            // 人物框加入后：剧情中对应的高亮恢复为普通文字
            storyDom.forEach(div => {
                div.querySelectorAll(`.char-highlight[data-char="${id}"]`).forEach(el => {
                    const text = el.textContent;
                    const p = el.parentNode;
                    const tn = document.createTextNode(text);
                    p.replaceChild(tn, el);
                    p.normalize();
                });
            });
            renderAll();
            showToast(`人物加入：${DATA.characters[id].name}`, 'success');
            return true;
        }

        // ---------- 手动组合推理 ----------
        function performCombine() {
            const selected = state.selectedClueIds;
            if (selected.length < 2) {
                showToast('请至少选择两条线索', 'error');
                return;
            }
            const clueIds = [];
            selected.forEach(blockId => {
                const block = state.allBlocks.find(b => b.id === blockId);
                if (block && block.sourceType === 'clue') {
                    clueIds.push(block.sourceId);
                }
            });
            if (clueIds.length < 2) {
                showToast('请选择有效的线索', 'error');
                return;
            }
            const sorted = [...clueIds].sort();
            const key = sorted.join('+');
            const combo = COMBINATIONS[key];
            if (combo) {
                const blockId = 'reason_' + key.replace(/\+/g, '_');
                if (!state.allBlocks.find(b => b.id === blockId)) {
                    state.allBlocks.push({
                        id: blockId,
                        type: 'reason',
                        label: '推理：' + combo.text.slice(0, 20) + '…',
                        detail: combo.text,
                        sourceId: key,
                        sourceType: 'reason',
                        owner: 'all'
                    });
                    if (combo.noteId) addNote(combo.noteId, 'all');
                    showToast(`推理成功！新推理块已生成`, 'success');
                    state.selectedClueIds = [];
                    renderAll();
                } else {
                    showToast('该推理已存在', '');
                }
            } else {
                showToast('这些线索无法组合，请尝试其他组合', 'error');
            }
        }

        function toggleSelectClue(blockId) {
            const idx = state.selectedClueIds.indexOf(blockId);
            if (idx > -1) {
                state.selectedClueIds.splice(idx, 1);
            } else {
                state.selectedClueIds.push(blockId);
            }
            renderClues();
        }

        function clearSelection() {
            state.selectedClueIds = [];
            renderClues();
            if (clueModalMask.style.display !== 'none') renderClueModal();
        }

        // ---------- 渲染引擎 ----------
        function renderAll() {
            renderStory();
            renderClues();
            renderItems();
            renderCharacters();
            updateCounts();
            // 设置所有拖拽块为可拖拽
            refreshDraggable();
        }

        // ---------- 打字机剧情引擎 ----------
        let storyDom = []; // 每行一个 div
        let storySceneId = null;
        let lineIndex = 0;
        let blocked = false; // 当前行有待填空，点击推进被阻塞
        let pendingScene = null; // 填空完成后待进入的下一场景（点击推进）
        let historyLog = []; // 已显示的行（用于回顾）
        let typingTimer = null;
        let typingNodes = [];
        let typingDoneCb = null;
        const TYPE_MS = 28; // 打字机每字间隔

        function renderStory() {
            const scene = SCENES[state.scene];
            if (!scene) {
                storyEl.innerHTML = '<div class="narr-line">场景未加载</div>';
                return;
            }
            currentSceneOwner = scene.owner || 'wu';

            // 初始化块
            if (scene.initBlocks) {
                scene.initBlocks.forEach(b => {
                    if (!state.allBlocks.find(ex => ex.id === b.id)) {
                        state.allBlocks.push({ ...b });
                    }
                });
            }

            state.slotConfigs = scene.slotConfigs || [];
            state.totalSlots = state.slotConfigs.length;

            if (storySceneId !== state.scene) {
                // 场景切换：淡出旧内容 → 背景天气切换 → 构建 → 章节标题渐显（点击才开始正文打字机）
                storyEl.classList.add('story-fade-out');
                setTimeout(() => {
                    // 切换背景天气
                    document.body.className = 'bg-' + (scene.bg || 'cloudy');
                    if (scene.bg === 'rain') startRain();
                    else stopRain();
                    buildStoryDom(scene);
                    storyEl.classList.remove('story-fade-out');
                    storyEl.classList.add('story-fade-in');
                    // 标题渐显停留后，等待玩家点击推进正文
                    setTimeout(() => {
                        storyEl.classList.remove('story-fade-in');
                    }, 900);
                }, 320);
            } else {
                // 场景未变：仅更新已显示行（收集的高亮移除、已填槽恢复）
                removeCollectedHighlights(storyEl);
                restoreSlots(storyEl);
            }
            updateCounts();
        }

        // 构建场景的所有行 DOM
        function buildStoryDom(scene) {
            storySceneId = state.scene;
            const lines = scene.story.split('\n').map(s => s.trim()).filter(Boolean);
            storyDom = lines.map(html => {
                const div = document.createElement('div');
                div.innerHTML = html;
                removeCollectedHighlights(div);
                restoreSlots(div);
                // 绑定线索/物品高亮点击
                div.querySelectorAll('.clue-highlight').forEach(el => {
                    el.removeEventListener('click', handleClueClick);
                    el.addEventListener('click', handleClueClick);
                });
                // 笔记高亮：已解锁才可点击查看，未解锁显示为普通文字
                div.querySelectorAll('.note-highlight').forEach(el => {
                    const noteId = el.dataset.note;
                    const unlocked = state.notes.find(n => n.id === noteId);
                    el.removeEventListener('click', handleNoteClick);
                    el.addEventListener('click', handleNoteClick);
                    if (!unlocked) el.classList.add('locked');
                });
                // 人物高亮：未加入人物框时高亮可点击，已加入则恢复普通文字
                div.querySelectorAll('.char-highlight').forEach(el => {
                    const charId = el.dataset.char;
                    if (state.characters.includes(charId)) {
                        const text = el.textContent;
                        const p = el.parentNode;
                        const tn = document.createTextNode(text);
                        p.replaceChild(tn, el);
                        p.normalize();
                    } else {
                        el.removeEventListener('click', handleCharClick);
                        el.addEventListener('click', handleCharClick);
                    }
                });
                return div;
            });
            if (storyDom.length === 0) {
                const div = document.createElement('div');
                div.innerHTML = '<div class="narr-line">（场景为空）</div>';
                storyDom.push(div);
            }
            storyEl.innerHTML = '';
            lineIndex = 0;
            blocked = false;
            historyLog = [];
            stopTyping();

            // 底部推进提示
            storyEl.appendChild(storyHint);
            storyHint.textContent = '▾ 点击空白处推进剧情';

            // 第一行作为章节标题直接显示（非打字机）
            const title = storyDom[0];
            title.classList.add('chapter-title');
            historyLog.push({ html: title.innerHTML, who: detectSpeaker(title) });
            lineIndex = 1;
            storyEl.appendChild(title);
        }

        // 笔记高亮点击：弹出悬浮窗（未解锁时提示）
        function handleNoteClick(e) {
            e.stopPropagation();
            const el = e.currentTarget;
            const noteId = el.dataset.note;
            const note = DATA.notes[noteId];
            if (!note) return;
            if (el.classList.contains('locked')) {
                showToast('此笔记尚未解锁，可通过线索组合推理获得', '');
                return;
            }
            notePopTitle.textContent = note.name;
            notePopBody.textContent = note.detail;
            const rect = el.getBoundingClientRect();
            notePop.style.display = 'block';
            const pw = notePop.offsetWidth;
            const ph = notePop.offsetHeight;
            let left = rect.left;
            let top = rect.bottom + 8;
            if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
            if (top + ph > window.innerHeight - 8) top = rect.top - ph - 8;
            if (top < 8) top = 8;
            notePop.style.left = left + 'px';
            notePop.style.top = top + 'px';
        }

        // 人物高亮点击：加入人物框
        function handleCharClick(e) {
            e.stopPropagation();
            const el = e.currentTarget;
            const charId = el.dataset.char;
            if (state.characters.includes(charId)) return;
            if (unlockChar(charId)) {
                // 立即移除该高亮（恢复普通文字）
                const text = el.textContent;
                const p = el.parentNode;
                const tn = document.createTextNode(text);
                p.replaceChild(tn, el);
                p.normalize();
            }
        }

        // 关闭笔记悬浮窗
        function closeNotePop() {
            notePop.style.display = 'none';
        }

        // 逐字打字机效果
        function startTyping(line, done) {
            const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode;
                if (n.nodeValue && n.nodeValue.trim()) {
                    n.__full = n.nodeValue;
                    n.nodeValue = '';
                    nodes.push(n);
                }
            }
            if (nodes.length === 0) {
                if (done) done();
                return;
            }
            typingNodes = nodes;
            typingDoneCb = done;
            let ni = 0;
            let pos = 0;
            typingTimer = setInterval(function() {
                const n = nodes[ni];
                n.nodeValue = n.__full.slice(0, ++pos);
                if (pos >= n.__full.length) {
                    ni++;
                    pos = 0;
                    if (ni >= nodes.length) finishTyping();
                }
            }, TYPE_MS);
        }

        // 立即完成当前打字（点击跳过）
        function finishTyping() {
            if (typingTimer) {
                clearInterval(typingTimer);
                typingTimer = null;
            }
            typingNodes.forEach(n => { n.nodeValue = n.__full; });
            typingNodes = [];
            const cb = typingDoneCb;
            typingDoneCb = null;
            if (cb) cb();
        }

        function stopTyping() {
            if (typingTimer) {
                clearInterval(typingTimer);
                typingTimer = null;
            }
            typingNodes.forEach(n => { if (n.__full) n.nodeValue = n.__full; });
            typingNodes = [];
            typingDoneCb = null;
        }

        // 显示下一行（打字机），到底后重头开始
        function showNextLine() {
            if (lineIndex >= storyDom.length) {
                storyEl.innerHTML = '';
                lineIndex = 0;
            }
            const line = storyDom[lineIndex];
            historyLog.push({ html: line.innerHTML, who: detectSpeaker(line) });
            lineIndex++;
            storyEl.appendChild(line);
            // 按实际高度裁剪：超出剧情框高度的最旧行移除，保留底部留白
            let guard = 0;
            while (storyEl.scrollHeight > storyEl.clientHeight + 2 && storyEl.children.length > 1 && guard < 50) {
                storyEl.removeChild(storyEl.firstChild);
                guard++;
            }
            startTyping(line, function() {
                // 打完一行：若行内含未填空槽，阻塞推进
                if (line.querySelector('.slot:not(.filled)')) {
                    blocked = true;
                    storyHint.textContent = '▾ 填入空缺内容后继续';
                    showToast('此处需要填入线索才能继续', '');
                }
            });
        }

        // 提取一行中的说话人（用于回顾窗口）
        function detectSpeaker(line) {
            const s = line.querySelector('.speaker');
            return s ? s.textContent : '';
        }

        // 打开剧情回顾
        function openHistory() {
            const body = historyBody;
            body.innerHTML = '';
            if (historyLog.length === 0) {
                body.innerHTML = '<div class="empty">暂无剧情记录</div>';
            } else {
                historyLog.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'hist-line';
                    const div2 = document.createElement('div');
                    div2.innerHTML = item.html;
                    // 去除交互元素，仅留文字
                    div2.querySelectorAll('.slot').forEach(sl => {
                        sl.classList.remove('filled');
                        sl.innerHTML = '<span class="placeholder">______</span>';
                    });
                    div.appendChild(div2);
                    body.appendChild(div);
                });
            }
            historyMask.style.display = 'flex';
        }

        function closeHistory() {
            historyMask.style.display = 'none';
        }

        // 移除已收集线索/物品的高亮
        function removeCollectedHighlights(root) {
            state.clues.concat(state.items).forEach(c => {
                const els = root.querySelectorAll(`.clue-highlight[data-clue="${c.id}"]`);
                els.forEach(el => {
                    const text = el.textContent;
                    const parent = el.parentNode;
                    const textNode = document.createTextNode(text);
                    parent.replaceChild(textNode, el);
                    parent.normalize();
                });
            });
        }

        // 恢复已填的槽
        function restoreSlots(root) {
            state.slotConfigs.forEach(cfg => {
                const el = root.querySelector(`.slot[data-slot="${cfg.id}"]`);
                if (el && state.usedBlockIds.has(cfg.expected)) {
                    el.dataset.filled = 'true';
                    el.dataset.content = cfg.expected;
                    const block = state.allBlocks.find(b => b.id === cfg.expected);
                    if (block) {
                        el.innerHTML = `<span class="slot-content">${block.label}</span>`;
                        el.classList.add('filled');
                    }
                }
            });
        }

        // 点击空白处：跳过打字 / 推进下一行 / 进入下一场景（被填空阻塞时不可推进）
        storyEl.addEventListener('click', function(e) {
            if (e.target.closest('.clue-highlight') || e.target.closest('.note-highlight') ||
                e.target.closest('.char-highlight') || e.target.closest('.slot') ||
                e.target.closest('.drag-block') || e.target.closest('button')) return;
            closeNotePop();
            if (blocked) {
                showToast('请先填入空缺内容，才能继续阅读', '');
                return;
            }
            if (pendingScene) {
                const next = pendingScene;
                pendingScene = null;
                loadScene(next);
                return;
            }
            if (typingTimer) {
                finishTyping();
                return;
            }
            showNextLine();
        });

        // 点击他处关闭笔记悬浮窗
        document.addEventListener('click', function(e) {
            if (notePop.style.display !== 'none' && !e.target.closest('.note-highlight')) {
                closeNotePop();
            }
        });

        // 剧情回顾
        historyBtn.addEventListener('click', openHistory);
        historyClose.addEventListener('click', closeHistory);
        historyMask.addEventListener('click', function(e) {
            if (e.target === historyMask) closeHistory();
        });

        function renderClues() {
            // 组合槽位：按选中线索动态生成，可多于 2 条
            const sel = state.selectedClueIds;
            let slotHtml = '';
            sel.forEach((bid, i) => {
                const block = state.allBlocks.find(b => b.id === bid);
                if (block) {
                    slotHtml += `
                        <div class="combo-slot filled" data-block="${block.id}">
                            ${block.label}
                            <span class="combo-slot-x">×</span>
                        </div>
                    `;
                }
            });
            // 末尾加号槽位：添加线索
            slotHtml += `
                <div class="combo-slot" id="comboAddSlot">
                    <span class="combo-slot-empty">＋ 添加</span>
                </div>
            `;
            comboSlots.innerHTML = slotHtml;
            comboSlots.querySelectorAll('.combo-slot.filled').forEach(el => {
                el.addEventListener('click', function() {
                    toggleSelectClue(this.dataset.block);
                });
            });
            document.getElementById('comboAddSlot').addEventListener('click', function() {
                renderClueModal();
                clueModalMask.style.display = 'flex';
            });

            // 推理结果列表（reason 块，可拖拽填空）
            let items = state.allBlocks.filter(b =>
                b.type === 'reason' && !state.usedBlockIds.has(b.id));
            if (items.length === 0) {
                clueList.innerHTML = '<div class="empty">推理结果将显示在这里</div>';
            } else {
                clueList.innerHTML = items.map(block => {
                    const ownerLabel = block.owner === 'wu' ? '吴秋崖' : block.owner === 'shan' ? '商难' : '通用';
                    const ownerClass = block.owner === 'wu' ? 'wu' : block.owner === 'shan' ? 'shan' : 'all';
                    return `
                        <div class="drag-block" data-block="${block.id}" data-type="reason" data-owner="${block.owner}">
                            ${block.label}
                            <span class="block-type">推理</span>
                            <span class="owner-tag ${ownerClass}">${ownerLabel}</span>
                            <div class="block-detail">${block.detail}</div>
                        </div>
                    `;
                }).join('');
            }
            reasonTitleCount.textContent = `(${items.length})`;

            combineBtn.disabled = sel.length < 2;
        }

        // 线索选择弹窗：渲染可用线索（可多选，不限制数量）
        function renderClueModal() {
            const items = state.allBlocks.filter(b =>
                b.type === 'clue' && !state.usedBlockIds.has(b.id));
            if (items.length === 0) {
                clueModalBody.innerHTML = '<div class="empty">暂无可用线索，请先点击剧情中的高亮词收集</div>';
                return;
            }
            clueModalBody.innerHTML = items.map(block => {
                const isSelected = state.selectedClueIds.includes(block.id);
                const ownerLabel = block.owner === 'wu' ? '吴秋崖' : block.owner === 'shan' ? '商难' : '通用';
                const ownerClass = block.owner === 'wu' ? 'wu' : block.owner === 'shan' ? 'shan' : 'all';
                return `
                    <div class="modal-clue ${isSelected ? 'selected' : ''}" data-block="${block.id}">
                        <div class="modal-clue-name">${block.label}
                            <span class="owner-tag ${ownerClass}">${ownerLabel}</span>
                        </div>
                        <div class="modal-clue-desc">${block.detail}</div>
                    </div>
                `;
            }).join('');
            clueModalBody.querySelectorAll('.modal-clue').forEach(el => {
                el.addEventListener('click', function() {
                    toggleSelectClue(this.dataset.block);
                    renderClueModal();
                    renderClues();
                });
            });
        }

        function handleClueSelect(e) {
            const el = e.currentTarget;
            const blockId = el.dataset.block;
            toggleSelectClue(blockId);
        }

        function renderItems() {
            let items = state.allBlocks.filter(b => b.type === 'item');
            if (items.length === 0) {
                itemList.innerHTML = '<div class="empty">点击剧情中的高亮词收集物品</div>';
                itemCountBadge.textContent = '0';
                return;
            }
            let html = '';
            items.forEach(block => {
                const used = state.usedBlockIds.has(block.id);
                const ownerLabel = block.owner === 'wu' ? '吴秋崖' : block.owner === 'shan' ? '商难' : '通用';
                const ownerClass = block.owner === 'wu' ? 'wu' : block.owner === 'shan' ? 'shan' : 'all';
                html += `
                    <div class="drag-block ${used ? 'used' : ''}" data-block="${block.id}" data-type="item" data-owner="${block.owner}">
                        ${block.label}
                        <span class="block-type">物品</span>
                        <span class="owner-tag ${ownerClass}">${ownerLabel}</span>
                        <div class="block-detail">${block.detail}</div>
                    </div>
                `;
            });
            itemList.innerHTML = html;
            itemCountBadge.textContent = state.allBlocks.filter(b=>b.type==='item').length;
        }

        function renderCharacters() {
            // 仅显示已点击加入的人物
            let items = state.allBlocks.filter(b =>
                b.type === 'char' && b.sourceId && state.characters.includes(b.sourceId));
            if (items.length === 0) {
                charList.innerHTML = '<div class="empty">点击剧情中的人物高亮词，将其加入人物框</div>';
                charCountBadge.textContent = '0';
                return;
            }
            let html = '';
            items.forEach(block => {
                const charId = block.sourceId;
                const data = DATA.characters[charId];
                if (!data) return;
                // 与线索/物品卡片样式一致（人物可反复拖动，永不置灰）
                html += `
                    <div class="drag-block" data-block="${block.id}" data-type="char" data-owner="${block.owner}">
                        ${data.name}
                        <span class="block-type">人物</span>
                        <span class="owner-tag all">${data.role}</span>
                        <div class="block-detail">${data.desc}　${data.info}</div>
                    </div>
                `;
            });
            charList.innerHTML = html;
            charCountBadge.textContent = items.length;
        }

        // 刷新所有拖拽块的 draggable 属性
        function refreshDraggable() {
            document.querySelectorAll('.drag-block:not(.used)').forEach(el => {
                el.setAttribute('draggable', 'true');
            });
        }

        // ---------- 高亮点击 ----------
        function handleClueClick(e) {
            const el = e.currentTarget;
            const id = el.dataset.clue;
            if (state.clues.find(c => c.id === id) || state.items.find(i => i.id === id)) return;
            const owner = currentSceneOwner || 'wu';
            let added = false;
            let kind = '';
            let name = id;
            if (DATA.items[id]) {
                added = addItem(id, owner);
                kind = '物品';
                name = DATA.items[id].name;
            } else if (DATA.clues[id]) {
                added = addClue(id, owner);
                kind = '线索';
                name = DATA.clues[id].name;
            }
            if (added) {
                // 移除该高亮（可能已被重渲染移除，需容错）
                const parent = el.parentNode;
                if (parent) {
                    const text = el.textContent;
                    const textNode = document.createTextNode(text);
                    parent.replaceChild(textNode, el);
                    parent.normalize();
                }
            }
        }

        // ---------- 声明式场景完成（原 onComplete 改为 toasts/rewards/goto 数据） ----------
        function completeScene(scene) {
            const owner = scene.owner || 'wu';
            (scene.toasts || []).forEach(t => {
                showToast(t.text, t.type || 'success');
            });
            (scene.rewards || []).forEach(r => {
                if (r.type === 'note') addNote(r.id, owner);
                else if (r.type === 'clue') addClue(r.id, owner);
                else if (r.type === 'item') addItem(r.id, owner);
            });
            if (scene.goto) {
                pendingScene = scene.goto;
                storyHint.textContent = scene.nextHint || '▾ 点击继续';
            }
        }

        // ---------- 检查完成 ----------
        function checkAllFilled() {
            const scene = SCENES[state.scene];
            const cfg = (scene && scene.slotConfigs) || [];
            const allFilled = cfg.length > 0 && cfg.every(c => state.usedBlockIds.has(c.expected));
            if (allFilled && scene) {
                setTimeout(() => completeScene(scene), 400);
            }
            updateCounts();
        }

        function updateCounts() {
            const total = state.slotConfigs.length;
            const filled = state.slotConfigs.filter(c => state.usedBlockIds.has(c.expected)).length;
            fillCount.textContent = filled;
            totalSlots.textContent = total || state.totalSlots;
            const usedReason = state.allBlocks.filter(b => b.type === 'reason' && state.usedBlockIds.has(b.id));
            reasonCount.textContent = usedReason.length;
        }

        // ---------- 加载场景 ----------
        function loadScene(sceneId) {
            state.scene = sceneId;
            pendingScene = null;
            const scene = SCENES[sceneId];
            if (scene) currentSceneOwner = scene.owner || 'wu';
            renderAll();
            setTimeout(() => {
                const sc = SCENES[sceneId];
                if (sc) {
                    const cfg = sc.slotConfigs || [];
                    const allFilled = cfg.length > 0 && cfg.every(c => state.usedBlockIds.has(c.expected));
                    if (allFilled) completeScene(sc);
                }
            }, 400);
        }

        // ---------- 组合按钮 / 线索弹窗 ----------
        combineBtn.addEventListener('click', performCombine);
        clearSelectionBtn.addEventListener('click', clearSelection);
        clueModalClose.addEventListener('click', function() {
            clueModalMask.style.display = 'none';
        });
        clueModalMask.addEventListener('click', function(e) {
            if (e.target === clueModalMask) clueModalMask.style.display = 'none';
        });

        // ---------- 拖拽事件委托（核心修复） ----------
        app.addEventListener('dragstart', function(e) {
            const target = e.target.closest('.drag-block:not(.used)');
            if (!target) return;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', target.dataset.block);
            target.classList.add('dragging');
        });

        app.addEventListener('dragend', function(e) {
            const target = e.target.closest('.drag-block');
            if (target) target.classList.remove('dragging');
        });

        app.addEventListener('dragover', function(e) {
            const slot = e.target.closest('.slot:not(.filled)');
            if (slot) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                slot.classList.add('drag-over');
            }
        });

        app.addEventListener('dragleave', function(e) {
            const slot = e.target.closest('.slot');
            if (slot) slot.classList.remove('drag-over');
        });

        app.addEventListener('drop', function(e) {
            e.preventDefault();
            const slot = e.target.closest('.slot:not(.filled)');
            if (!slot) return;
            slot.classList.remove('drag-over');

            const blockId = e.dataTransfer.getData('text/plain');
            if (!blockId) {
                showToast('无效的拖拽', 'error');
                return;
            }

            const expected = slot.dataset.expect;
            if (blockId === expected) {
                // 匹配成功
                slot.dataset.filled = 'true';
                slot.dataset.content = blockId;
                const block = state.allBlocks.find(b => b.id === blockId);
                if (block) {
                    slot.innerHTML = `<span class="slot-content">${block.label}</span>`;
                    slot.classList.add('filled', 'correct-flash');
                    state.usedBlockIds.add(blockId);
                    // 从组合选中移除（已使用的块不再可选）
                    const selIdx = state.selectedClueIds.indexOf(blockId);
                    if (selIdx > -1) state.selectedClueIds.splice(selIdx, 1);
                    // 人物块可反复拖动填空，不标记已使用；其余块标记为已使用（防止重复拖动）
                    if (block.type !== 'char') {
                        document.querySelectorAll(`.drag-block[data-block="${blockId}"]`).forEach(el => {
                            el.classList.add('used');
                            el.setAttribute('draggable', 'false');
                        });
                    }
                    showToast(`✓ 填入「${block.label}」成功！`, 'success');
                    // 立即刷新各面板，不等整体刷新
                    renderClues();
                    renderItems();
                    renderCharacters();
                    updateCounts();
                    checkAllFilled();
                    // 重新刷新拖拽属性
                    refreshDraggable();
                    // 填空正确后：解除阻塞，等待玩家点击推进下一行
                    if (blocked) {
                        const lineEl = (function() {
                            let el = slot.parentNode;
                            while (el && el.parentNode !== storyEl) el = el.parentNode;
                            return el;
                        })();
                        const stillEmpty = lineEl ? lineEl.querySelector('.slot:not(.filled)') : false;
                        if (!stillEmpty) {
                            blocked = false;
                            storyHint.textContent = '▾ 点击空白处推进剧情';
                        }
                    }
                }
            } else {
                slot.classList.add('wrong-flash');
                showToast('❌ 这个块不适合这个位置，请尝试其他组合', 'error');
                setTimeout(() => slot.classList.remove('wrong-flash'), 500);
            }
        });

        // ---------- 启动 ----------
        loadScene(STORY.startScene || Object.keys(SCENES)[0] || 'wu_start');
    </script>
</body>
</html>
