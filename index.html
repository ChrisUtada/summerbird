<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>鸣鸟之夏</title>
    <style>
        /* 完整样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0a0a;
            color: #ddd2c2;
            font-family: 'Georgia', 'SimSun', 'Songti SC', serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
            transition: background 1.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        /* 统一滚动条主题：所有滚动容器共用一套（故事区/抽屉/列表/弹层） */
        * {
            scrollbar-width: thin;
            scrollbar-color: #3a322a #12100e;
        }
        *::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        *::-webkit-scrollbar-track {
            background: #12100e;
        }
        *::-webkit-scrollbar-thumb {
            background: #3a322a;
            border-radius: 3px;
        }
        *::-webkit-scrollbar-thumb:hover {
            background: #5a4a38;
        }
        /* 天气背景层（位于 #app 之后） */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            pointer-events: none;
            transition: opacity 1.2s ease;
        }
        body.bg-cloudy .bg-layer {
            background:
                radial-gradient(ellipse 120% 70% at 50% -10%, #4a4a55 0%, #2c2c36 45%, #16161d 100%);
        }
        body.bg-night .bg-layer {
            background:
                radial-gradient(ellipse 130% 80% at 50% -20%, #0e1220 0%, #070a12 50%, #020308 100%);
        }
        body.bg-rain .bg-layer {
            background:
                linear-gradient(180deg, #232a33 0%, #141a22 55%, #0b0f15 100%);
        }
        /* 雨天：canvas 随机粒子雨（见 JS 粒子引擎） */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        body.bg-rain #particleCanvas {
            opacity: 0.7;
        }
        .bg-fog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 21;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        body.bg-rain .bg-fog {
            opacity: 0.35;
            background:
                radial-gradient(ellipse 90% 50% at 50% 90%, rgba(190, 210, 230, 0.16) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 20% 70%, rgba(170, 190, 215, 0.10) 0%, transparent 70%);
            animation: fogDrift 9s ease-in-out infinite alternate;
        }
        @keyframes fogDrift {
            from {
                transform: translateX(-2%);
            }
            to {
                transform: translateX(2%);
            }
        }
        /* 阴天：黑色云雾随机飘动（覆盖在书页之上，半透明不挡阅读） */
        .bg-cloud-veil {
            position: fixed;
            top: -20%;
            left: -20%;
            right: -20%;
            bottom: -20%;
            z-index: 22;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        body.bg-cloudy .bg-cloud-veil {
            opacity: 0.55;
            background:
                radial-gradient(ellipse 28% 22% at 15% 30%, rgba(5, 7, 12, 0.85) 0%, transparent 70%),
                radial-gradient(ellipse 22% 18% at 70% 20%, rgba(4, 6, 10, 0.8) 0%, transparent 70%),
                radial-gradient(ellipse 30% 24% at 85% 65%, rgba(5, 7, 12, 0.75) 0%, transparent 70%),
                radial-gradient(ellipse 20% 16% at 30% 80%, rgba(4, 6, 10, 0.7) 0%, transparent 70%),
                radial-gradient(ellipse 25% 20% at 55% 45%, rgba(6, 8, 14, 0.65) 0%, transparent 70%);
            animation: cloudDriftA 38s ease-in-out infinite alternate;
        }
        .bg-cloud-veil::after {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            right: -20%;
            bottom: -20%;
            background:
                radial-gradient(ellipse 24% 20% at 85% 30%, rgba(5, 7, 12, 0.7) 0%, transparent 70%),
                radial-gradient(ellipse 26% 22% at 20% 55%, rgba(4, 6, 10, 0.75) 0%, transparent 70%),
                radial-gradient(ellipse 18% 15% at 60% 85%, rgba(5, 7, 12, 0.65) 0%, transparent 70%);
            animation: cloudDriftB 52s ease-in-out infinite alternate;
        }
        @keyframes cloudDriftA {
            from {
                transform: translate(0%, 0%) scale(1);
            }
            to {
                transform: translate(-6%, 4%) scale(1.08);
            }
        }
        @keyframes cloudDriftB {
            from {
                transform: translate(0%, 0%) scale(1);
            }
            to {
                transform: translate(5%, -5%) scale(1.1);
            }
        }
        /* ---------- 书本外壳（32 开：单页宽:高 ≈ 0.71，摊开两页 + 书脊） ---------- */
        #app {
            --page-h: min(94vh, 940px);
            width: fit-content;
            height: var(--page-h);
            background: linear-gradient(180deg, #1d1712, #14100c);
            border: 1px solid #2e2820;
            border-radius: 4px 16px 16px 4px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.72), 0 6px 18px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3a332b;
            padding: 12px 22px 10px;
            flex-wrap: wrap;
            gap: 6px;
            background: linear-gradient(180deg, #1e1812, #17120d);
        }
        .game-title {
            font-size: 20px;
            letter-spacing: 6px;
            color: #bfae95;
        }
        .game-title span {
            color: #d65a3c;
            font-weight: bold;
        }
        .status-bar {
            font-size: 13px;
            color: #a8977d;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .status-bar .badge {
            background: #1f1a16;
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid #3a322a;
            color: #c2b4a0;
        }
        .status-bar .badge .num {
            color: #f0c060;
        }
        .btn-drawer {
            background: #241e17;
            border: 1px solid #3a322a;
            color: #c2b4a0;
            padding: 3px 16px 10px;
            border-radius: 3px 3px 0 0;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            gap: 6px;
            align-items: center;
            clip-path: polygon(0 0, 100% 0, 100% 74%, 50% 100%, 0 74%);
            transition: all 0.2s;
        }
        .btn-drawer .num {
            color: #f0c060;
        }
        .btn-drawer:hover {
            border-color: #d65a3c;
            color: #f0e6d4;
            transform: translateY(-1px);
        }
        .btn-drawer.active {
            background: #d65a3c;
            border-color: #e07050;
            color: #fff6ea;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
            transform: translateY(-2px);
        }
        .btn-drawer.active .num {
            color: #ffe9a8;
        }
        .btn-history {
            background: #2a241d;
            border: 1px solid #4a4034;
            color: #d8cbb4;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-history:hover {
            border-color: #d65a3c;
            color: #f0e6d4;
        }
        .main-layout {
            display: flex;
            gap: 0;
            flex: 1;
            min-height: 0;
        }
        /* 左页：剧情 */
        .story-column {
            width: calc(var(--page-h) * 0.71);
            min-width: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 12px 0 22px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }
        .story-area {
            flex: 1;
            min-height: 0;
            background: linear-gradient(180deg, #1c1712, #16110d);
            padding: 30px 36px 52px;
            overflow: hidden;
            line-height: 1.9;
            font-size: 15px;
            color: #e6dccb;
            position: relative;
            cursor: pointer;
            transition: opacity 0.32s ease;
        }
        .story-hint {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            color: #8d7c64;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
        }
        .story-area.story-fade-out {
            opacity: 0;
        }
        .story-area.story-fade-in {
            animation: storyFadeIn 0.5s ease;
        }
        @keyframes storyFadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        .chapter-title {
            text-align: center;
            font-size: 19px;
            color: #f0c060;
            letter-spacing: 5px;
            margin: 14px 0 20px;
            border-bottom: 1px solid #3a332b;
            padding-bottom: 12px;
        }
        .story-area .narr-line {
            color: #b9ab94;
            margin-bottom: 8px;
        }
        .story-area .divider {
            border: none;
            border-top: 1px solid #3a332b;
            margin: 12px 0;
        }
        .story-area .msg {
            margin-bottom: 8px;
        }
        .story-area .msg .speaker {
            font-weight: normal;
            color: #e6dccb;
            margin-right: 6px;
        }
        .story-area .msg .speaker.wu,
        .story-area .msg .speaker.shan,
        .story-area .msg .speaker.old,
        .story-area .msg .speaker.zhang { color: #e6dccb; }
        .story-area .msg .text {
            display: inline;
        }
        .clue-highlight {
            color: #e8b84a;
            font-weight: bold;
            cursor: pointer;
            padding: 0 3px;
            transition: background 0.2s;
        }
        .clue-highlight:hover {
            background: #3a2a1a;
        }
        .clue-highlight.collected {
            color: inherit;
            font-weight: normal;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 2px;
            text-decoration-color: #e8b84a;
            cursor: default;
        }
        .clue-highlight.collected:hover {
            background: none;
        }
        .note-highlight {
            color: #8fd0c0;
            font-weight: bold;
            cursor: pointer;
            padding: 0 3px;
            transition: background 0.2s;
        }
        .note-highlight:hover {
            background: #12312a;
        }
        .note-highlight.collected {
            color: inherit;
            font-weight: normal;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 2px;
            text-decoration-color: #8fd0c0;
        }
        .char-highlight {
            color: #d8a8f0;
            font-weight: bold;
            cursor: pointer;
            padding: 0 3px;
            transition: background 0.2s;
        }
        .char-highlight:hover {
            background: #2a1a3a;
        }
        .char-highlight.collected {
            color: inherit;
            font-weight: normal;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 2px;
            text-decoration-color: #d8a8f0;
            cursor: default;
        }
        .char-highlight.collected:hover {
            background: none;
        }
        .note-pop {
            position: fixed;
            z-index: 1200;
            max-width: 320px;
            background: #1d1a14;
            border: 1px solid #2f7d6a;
            border-radius: 10px;
            padding: 10px 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .note-pop .note-pop-title {
            color: #8fd0c0;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            padding-bottom: 5px;
            border-bottom: 1px solid #2a4a40;
        }
        .note-pop .note-pop-body {
            color: #d8ccb8;
            font-size: 13px;
            line-height: 1.8;
        }
        /* 章节档案（回顾）：章节头可折叠 */
        .hist-scene {
            margin-bottom: 10px;
        }
        .hist-scene-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 10px;
            background: #241e17;
            border: 1px solid #4a4034;
            border-left: 3px solid #f0c060;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            font-size: 13px;
            color: #e8decc;
        }
        .hist-scene-head:hover {
            border-color: #d65a3c;
            background: #322a21;
        }
        .hist-scene-title {
            letter-spacing: 1px;
        }
        .hist-scene-arrow {
            font-size: 12px;
            color: #f0c060;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }
        .hist-scene.collapsed .hist-scene-arrow {
            transform: rotate(90deg);
        }
        .hist-scene.collapsed .hist-scene-body {
            display: none;
        }
        .hist-scene-body {
            padding: 8px 0 2px 8px;
        }
        .hist-scene-body .hist-line {
            font-size: 13px;
            color: #d4c8b8;
            line-height: 1.8;
            margin-bottom: 10px;
            text-align: justify;
        }
        .hist-scene-body .hist-line:first-child {
            margin-top: 2px;
        }
        /* 线索选择卡片（与推理结果卡片同款式，仅点击选择用） */
        .clue-item {
            cursor: pointer;
        }
        .slot {
            display: inline-block;
            min-width: 100px;
            min-height: 28px;
            border-bottom: 3px dashed #5a7050;
            margin: 0 4px;
            padding: 0 6px;
            color: #93a980;
            font-size: 14px;
            vertical-align: bottom;
            transition: all 0.3s;
            background: rgba(30, 44, 30, 0.35);
            border-radius: 0 0 4px 4px;
            cursor: default;
            text-align: center;
        }
        .slot .placeholder {
            color: #6d8058;
            font-size: 12px;
        }
        .slot.filled {
            border-bottom: 3px solid #e8b84a;
            color: #e8b84a;
            font-style: normal;
            background: rgba(232, 184, 74, 0.08);
        }
        .slot .slot-content {
            display: inline-block;
        }
        .slot.drag-over {
            border-bottom-color: #b5432a;
            background: rgba(181, 67, 42, 0.2);
        }
        .slot.correct-flash {
            animation: flashGreen 0.6s ease;
        }
        @keyframes flashGreen {
            0%,
            100% {
                background: rgba(232, 184, 74, 0.08);
            }
            50% {
                background: rgba(74, 200, 100, 0.25);
            }
        }
        .slot.wrong-flash {
            animation: flashRed 0.5s ease;
        }
        @keyframes flashRed {
            0%,
            100% {
                background: rgba(20, 30, 20, 0.25);
            }
            50% {
                background: rgba(200, 50, 50, 0.25);
            }
        }
        /* ---------- 右页：抽屉（推理 / 物品 / 人物） ---------- */
        .drawer {
            flex: 0 0 0;
            min-width: 0;
            background: linear-gradient(180deg, #1b1611, #150f0b);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 14px 0 22px rgba(0, 0, 0, 0.55), inset 2px 0 0 #0d0a08;
            transition: flex-basis 0.28s ease;
        }
        .drawer.open {
            flex-basis: calc(var(--page-h) * 0.71);
        }
        .drawer-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 12px;
            border-bottom: 1px solid #3a332b;
            font-size: 14px;
            color: #d65a3c;
            letter-spacing: 3px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #1e1812, #17120d);
        }
        .drawer-close {
            background: none;
            border: none;
            color: #9a8b72;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            padding: 0 4px;
            font-family: inherit;
        }
        .drawer-close:hover {
            color: #f0e6d4;
        }
        .drawer-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .drawer-sec {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            padding: 16px 20px 20px;
            overflow: hidden;
        }
        .drawer-sec.active {
            display: flex;
        }
        /* 抽屉内列表两栏排布（书页宽度下卡片更紧凑） */
        #clueList,
        #itemList,
        #charList {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-content: start;
            min-height: 0;
        }
        #clueList .drag-block,
        #itemList .drag-block,
        #charList .drag-block {
            margin-bottom: 0;
        }
        #clueList .empty,
        #itemList .empty,
        #charList .empty {
            grid-column: 1 / -1;
        }
        .drawer::-webkit-scrollbar {
            width: 4px;
        }
        .drawer::-webkit-scrollbar-track {
            background: #12100e;
        }
        .drawer::-webkit-scrollbar-thumb {
            background: #3a322a;
            border-radius: 4px;
        }
        /* 抽屉内滚动容器统一风格（与整书暗色主题一致） */
        #cluePick::-webkit-scrollbar,
        #clueList::-webkit-scrollbar,
        #itemList::-webkit-scrollbar,
        #charList::-webkit-scrollbar,
        #historyBody::-webkit-scrollbar {
            width: 5px;
        }
        #cluePick::-webkit-scrollbar-track,
        #clueList::-webkit-scrollbar-track,
        #itemList::-webkit-scrollbar-track,
        #charList::-webkit-scrollbar-track,
        #historyBody::-webkit-scrollbar-track {
            background: #12100e;
        }
        #cluePick::-webkit-scrollbar-thumb,
        #clueList::-webkit-scrollbar-thumb,
        #itemList::-webkit-scrollbar-thumb,
        #charList::-webkit-scrollbar-thumb,
        #historyBody::-webkit-scrollbar-thumb {
            background: #4a4034;
            border-radius: 4px;
        }
        #cluePick::-webkit-scrollbar-thumb:hover,
        #clueList::-webkit-scrollbar-thumb:hover,
        #itemList::-webkit-scrollbar-thumb:hover,
        #charList::-webkit-scrollbar-thumb:hover,
        #historyBody::-webkit-scrollbar-thumb:hover {
            background: #d65a3c;
        }
        /* Firefox 风格 */
        #cluePick,
        #clueList,
        #itemList,
        #charList,
        #historyBody {
            scrollbar-width: thin;
            scrollbar-color: #4a4034 #12100e;
        }
        .filter-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .filter-tabs button {
            background: #241f1a;
            border: 1px solid #3a332b;
            color: #a8977d;
            padding: 3px 14px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .filter-tabs button:hover {
            border-color: #5a4a32;
            color: #d8cbb4;
        }
        .filter-tabs button.active {
            background: #d65a3c;
            border-color: #d65a3c;
            color: #faf4ea;
        }
        .filter-tabs button .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .filter-tabs button .dot.wu {
            background: #8ab0c0;
        }
        .filter-tabs button .dot.shan {
            background: #c0a080;
        }
        .drawer .empty {
            color: #8a7b64;
            font-size: 13px;
            padding: 10px 0;
            text-align: center;
        }
        .drag-block {
            background: #262019;
            border: 1px solid #4a4034;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            font-size: 16px;
            color: #efe6d6;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 10px;
        }
        .drag-block:hover {
            border-color: #d65a3c;
            background: #322a21;
        }
        .drag-block:active {
            cursor: grabbing;
        }
        .drag-block.dragging {
            opacity: 0.4;
        }
        .drag-block .block-label {
            font-size: 13px;
            color: #c2ae8c;
            margin-right: 2px;
        }
        .drag-block .block-type {
            font-size: 12px;
            color: #9cc080;
            border: 1px solid #3c5344;
            padding: 0 8px;
            border-radius: 10px;
            font-weight: normal;
        }
        .drag-block .block-detail {
            font-size: 14px;
            line-height: 1.8;
            color: #c0b29c;
            width: 100%;
            padding-left: 4px;
            margin-top: 4px;
        }
        .drag-block .owner-tag {
            font-size: 12px;
            padding: 0 8px;
            border-radius: 10px;
            background: #3a322a;
            color: #b3a287;
        }
        .drag-block .owner-tag.wu {
            background: #1e3038;
            color: #a8ccdd;
            border: 1px solid #3a5a68;
        }
        .drag-block .owner-tag.shan {
            background: #382a18;
            color: #d8b48e;
            border: 1px solid #68502c;
        }
        .drag-block .owner-tag.all {
            background: #2c2620;
            color: #c9bb9f;
            border: 1px solid #4a4034;
        }
        .drag-block.used {
            opacity: 0.25;
            cursor: default;
