    <script src="compiler.js"></script>
    <script src="story.js"></script>
    <script>
        // ============================================================
        //  完整修复版 – 所有功能正常，拖拽使用事件委托
        //  内容已迁移至 story.js（compiler.js 负责剧本 DSL 编译）
        // ============================================================

        // ---------- 状态 ----------
        const state = {
            scene: 'wu_start',
            clues: [], // 收集的线索 { id, owner }
            items: [], // 收集的物品 { id, owner }
            notes: [], // 已解锁的笔记 { id, owner }
            characters: [],
            usedBlockIds: new Set(), // 填空完成追踪：仅记录已填空位的 expect id
            placedIds: new Set(), // 当前正放置在空位里的卡片 id：填入即隐藏、回退即恢复（线索/推理/物品/人物均适用，可反复使用）
            consumedIds: new Set(), // 消费追踪：仅「组合后删除」(removeAfterCombine) 的线索进入，用于从列表隐藏
            allBlocks: [], // 所有可拖动块
            selectedClueIds: [], // 选中的线索块ID（用于组合）
            slotConfigs: [],
            combinedKeys: [], // 已完成的组合 key（防止重复推理）
        };
        let completedScenes = new Set(); // 本局已完成（含读完）的场景 id，防止重复完成

        // ---------- 数据（内容全部来自 story.js，剧本经 compiler.js 编译） ----------
        const STORY = window.__STORY__ || {};
        const DATA = STORY.data || { clues: {}, items: {}, notes: {}, characters: {} };
        const COMBINATIONS = STORY.combinations || {};
        const COMPILED = SBCompiler.compileScenes(STORY.scenes || [], {
            speakers: STORY.speakers || {},
            ids: {
                char: DATA.characters,
                clue: Object.assign({}, DATA.clues, DATA.items),
                item: DATA.items,
                note: DATA.notes
            }
        });
        const SCENES = COMPILED.scenes;

        // ---------- DOM 引用 ----------
        const app = document.getElementById('app');
        const storyEl = document.getElementById('storyArea');
        const storyHint = document.getElementById('storyHint');
        const clueList = document.getElementById('clueList');
        const charList = document.getElementById('charList');
        const reasonCount = document.getElementById('reasonCount');
        const charCountBadge = document.getElementById('charCountBadge');
        const itemList = document.getElementById('itemList');
        const itemCountBadge = document.getElementById('itemCountBadge');
        const combineBtn = document.getElementById('combineBtn');
        const toast = document.getElementById('toast');
        const notePop = document.getElementById('notePop');
        const notePopTitle = document.getElementById('notePopTitle');
        const notePopBody = document.getElementById('notePopBody');
        const historyBody = document.getElementById('historyBody');
        const cluePick = document.getElementById('cluePick');
        const reasonTitleCount = document.getElementById('reasonTitleCount');
        const drawer = document.getElementById('drawer');
        const drawerTitle = document.getElementById('drawerTitle');
        const drawerClose = document.getElementById('drawerClose');
        const fillModal = document.getElementById('fillModal');
        const fillClose = document.getElementById('fillClose');
        const fillList = document.getElementById('fillList');
        const pickupChoiceModal = document.getElementById('pickupChoiceModal');
        const pickupChoiceClose = document.getElementById('pickupChoiceClose');
        const pickupChoiceList = document.getElementById('pickupChoiceList');

        let toastTimer = null;
        let currentSceneOwner = 'wu';

        // ---------- 抽屉切换（推理 / 物品 / 人物 / 回顾，同时只开一个） ----------
        const DRAWER_SECTIONS = {
            reason: 'drawerSecReason',
            item: 'drawerSecItem',
            char: 'drawerSecChar',
            history: 'drawerSecHistory'
        };
        let openDrawer = null;

        function closeDrawer() {
            openDrawer = null;
            drawer.classList.remove('open');
            document.querySelectorAll('.btn-drawer').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.drawer-sec').forEach(s => s.classList.remove('active'));
        }

        function openDrawerByKey(key) {
            const btn = document.querySelector('.btn-drawer[data-drawer="' + key + '"]');
            openDrawer = key;
            drawer.classList.add('open');
            drawerTitle.textContent = (btn && btn.dataset.title) || '面板';
            document.querySelectorAll('.btn-drawer').forEach(b => {
                b.classList.toggle('active', b.dataset.drawer === key);
            });
            document.querySelectorAll('.drawer-sec').forEach(s => {
                s.classList.toggle('active', s.id === DRAWER_SECTIONS[key]);
            });
            if (key === 'history') renderHistory();
        }

        function toggleDrawer(key) {
            if (openDrawer === key) closeDrawer();
            else openDrawerByKey(key);
        }

        document.querySelectorAll('.btn-drawer').forEach(btn => {
            btn.addEventListener('click', function() {
                toggleDrawer(this.dataset.drawer);
            });
        });
        drawerClose.addEventListener('click', closeDrawer);

        // ---------- 随机粒子雨引擎（canvas） ----------
        const particleCanvas = document.getElementById('particleCanvas');
        const pctx = particleCanvas.getContext('2d');
        let rainParticles = [];
        let rainRaf = null;
        const RAIN_COUNT = 90;

        function resizeParticles() {
            particleCanvas.width = window.innerWidth;
            particleCanvas.height = window.innerHeight;
        }

        function spawnRain() {
            rainParticles = [];
            for (let i = 0; i < RAIN_COUNT; i++) {
                rainParticles.push({
                    x: Math.random() * particleCanvas.width,
                    y: Math.random() * particleCanvas.height,
                    len: 6 + Math.random() * 16,
                    speed: 8 + Math.random() * 10,
                    drift: (Math.random() - 0.5) * 1.6,
                    alpha: 0.12 + Math.random() * 0.35,
                    w: 0.6 + Math.random() * 0.9
                });
            }
        }

        function drawRain() {
            pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
            pctx.lineCap = 'round';
            for (const p of rainParticles) {
                pctx.globalAlpha = p.alpha;
                pctx.strokeStyle = '#c8dcf0';
                pctx.lineWidth = p.w;
                pctx.beginPath();
                pctx.moveTo(p.x, p.y);
                pctx.lineTo(p.x + p.drift * 2, p.y + p.len);
                pctx.stroke();
                p.y += p.speed;
                p.x += p.drift;
                if (p.y > particleCanvas.height + p.len) {
                    p.y = -p.len - Math.random() * 40;
                    p.x = Math.random() * particleCanvas.width;
                }
            }
            pctx.globalAlpha = 1;
            rainRaf = requestAnimationFrame(drawRain);
        }

        function startRain() {
            if (rainRaf) return;
            resizeParticles();
            spawnRain();
            rainRaf = requestAnimationFrame(drawRain);
        }

        function stopRain() {
            if (rainRaf) {
                cancelAnimationFrame(rainRaf);
                rainRaf = null;
            }
            pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        }

        window.addEventListener('resize', function() {
            resizeParticles();
            if (rainRaf) spawnRain();
        });

        // ---------- Toast ----------
        function showToast(text, type = '') {
            toast.textContent = text;
            toast.className = 'toast show ' + type;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        }

        // ---------- 核心操作 ----------
        function addClue(id, owner) {
            if (state.clues.find(c => c.id === id)) return false;
            if (!DATA.clues[id]) return false;
            const ownerVal = owner || currentSceneOwner || 'wu';
            state.clues.push({ id, owner: ownerVal });
            const blockId = 'clue_' + id;
            if (!state.allBlocks.find(b => b.id === blockId)) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'clue',
                    label: DATA.clues[id].name,
                    detail: DATA.clues[id].desc,
                    sourceId: id,
                    sourceType: 'clue',
                    owner: ownerVal
                });
            }
            renderAll();
            showToast(`${DATA.clues[id].name}已记录`, 'success');
            return true;
        }

        function addItem(id, owner) {
            if (state.items.find(i => i.id === id)) return false;
            if (!DATA.items[id]) return false;
            const ownerVal = owner || currentSceneOwner || 'wu';
            state.items.push({ id, owner: ownerVal });
            const blockId = 'item_' + id;
            if (!state.allBlocks.find(b => b.id === blockId)) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'item',
                    label: DATA.items[id].name,
                    detail: DATA.items[id].desc,
                    sourceId: id,
                    sourceType: 'item',
                    owner: ownerVal
                });
            }
            renderAll();
            showToast(`${DATA.items[id].name}已记录`, 'success');
            return true;
        }

        function addNote(id, owner) {
            if (state.notes.find(n => n.id === id)) return false;
            if (!DATA.notes[id]) return false;
            const ownerVal = owner || currentSceneOwner || 'wu';
            state.notes.push({ id, owner: ownerVal });
            const blockId = 'note_' + id;
            if (!state.allBlocks.find(b => b.id === blockId)) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'note',
                    label: DATA.notes[id].name,
                    detail: DATA.notes[id].detail,
                    sourceId: id,
                    sourceType: 'note',
                    owner: ownerVal
                });
            }
            renderAll();
            return true;
        }

        function unlockChar(id) {
            if (state.characters.includes(id)) return false;
            if (!DATA.characters[id]) return false;
            state.characters.push(id);
            const blockId = 'char_' + id;
            const hasBlock = state.allBlocks.find(b => b.id === blockId) ||
                state.allBlocks.find(b => b.type === 'char' && b.sourceId === id);
            if (!hasBlock) {
                state.allBlocks.push({
                    id: blockId,
                    type: 'char',
                    label: DATA.characters[id].name,
                    detail: DATA.characters[id].desc + ' — ' + DATA.characters[id].info,
                    sourceId: id,
                    sourceType: 'char',
                    owner: 'all'
                });
            }
            // 人物框加入后：剧情中对应的高亮划线标记
            storyDom.forEach(div => {
                div.querySelectorAll(`.char-highlight[data-char="${id}"]`).forEach(el => {
                    el.classList.add('collected');
                    el.removeEventListener('click', handleCharClick);
                });
            });
            renderAll();
            showToast(`${DATA.characters[id].name}已记录`, 'success');
            return true;
        }

        // ---------- 组合推理（恢复「之前的版本」：选线索 → 产出推理结果卡） ----------
        function performCombine() {
            const selected = state.selectedClueIds;
            if (selected.length < 2) {
                showToast('请至少选择两条线索', 'error');
                return;
            }
            const clueIds = [];
            selected.forEach(function (blockId) {
                const block = state.allBlocks.find(b => b.id === blockId);
                if (block && block.sourceType === 'clue') clueIds.push(block.sourceId);
            });
            if (clueIds.length < 2) {
                showToast('请选择有效的线索', 'error');
                return;
            }
            const key = clueIds.slice().sort().join('+');
            const combo = COMBINATIONS[key];
            if (combo) {
                if (combo.block) {
                    if (state.allBlocks.find(b => b.id === combo.block.id)) {
                        showToast('该推理已存在', '');
                        return;
                    }
                    state.allBlocks.push({
                        id: combo.block.id,
                        type: 'reason',
                        label: combo.block.label,
                        detail: combo.block.detail || '',
                        sourceId: key,
                        sourceType: 'reason',
                        owner: 'all'
                    });
                } else if (state.combinedKeys.indexOf(key) > -1) {
                    showToast('该推理已存在', '');
                    return;
                }
                if (state.combinedKeys.indexOf(key) === -1) state.combinedKeys.push(key);
                if (combo.noteId) addNote(combo.noteId, 'all');
                // 组合后按线索配置决定是否从线索栏移除（消费，与填空消费相互独立）
                clueIds.forEach(function (id) {
                    const cfg = DATA.clues[id];
                    if (cfg && cfg.removeAfterCombine) {
                        const bid = 'clue_' + id;
                        if (!state.consumedIds.has(bid)) state.consumedIds.add(bid);
                        const sidx = state.selectedClueIds.indexOf(bid);
                        if (sidx > -1) state.selectedClueIds.splice(sidx, 1);
                    }
                });
                showToast('✓ 推理成功！新推理结果已生成', 'success');
                state.selectedClueIds = [];
                renderAll();
            } else {
                showToast('这些线索无法组合，请尝试其他组合', 'error');
            }
        }

        function toggleSelectClue(blockId) {
            const idx = state.selectedClueIds.indexOf(blockId);
            if (idx > -1) {
                state.selectedClueIds.splice(idx, 1);
            } else {
                state.selectedClueIds.push(blockId);
            }
            renderClues();
        }

        // ---------- 渲染引擎 ----------
        function renderAll() {
            renderStory();
            renderClues();
            renderItems();
            renderCharacters();
            updateCounts();
            // 设置所有拖拽块为可拖拽
            refreshDraggable();
        }

        // ---------- 打字机剧情引擎 ----------
        let storyDom = []; // 每行一个 div
        let storySceneId = null;
        let lineIndex = 0;
        let blocked = false; // 当前行有待填空，点击推进被阻塞
        let pendingScene = null; // 填空完成后待进入的下一场景（点击推进）
        let typingTimer = null;
        let typingNodes = [];
        let typingDoneCb = null;
        const TYPE_MS = 28; // 打字机每字间隔

        function renderStory() {
            const scene = SCENES[state.scene];
            if (!scene) {
                storyEl.innerHTML = '<div class="narr-line">场景未加载</div>';
                return;
            }
            currentSceneOwner = scene.owner || 'wu';

            // 注意：可组合的推理卡默认不预置，需由「组合推理」产出；无组合来源的卡仍由 initBlocks 预置
            state.slotConfigs = scene.slotConfigs || [];

            if (storySceneId !== state.scene) {
                // 场景切换：淡出旧内容 → 背景天气切换 → 构建 → 章节标题渐显（点击才开始正文打字机）
                storyEl.classList.add('story-fade-out');
                setTimeout(() => {
                    // 切换背景天气
                    document.body.className = 'bg-' + (scene.bg || 'cloudy');
                    if (scene.bg === 'rain') startRain();
                    else stopRain();
                    buildStoryDom(scene);
                    storyEl.classList.remove('story-fade-out');
                    storyEl.classList.add('story-fade-in');
                    // 标题渐显停留后，等待玩家点击推进正文
                    setTimeout(() => {
                        storyEl.classList.remove('story-fade-in');
                    }, 900);
                }, 320);
            } else {
                // 场景未变：仅更新已显示行（已收集划线、已填槽恢复）
                markCollectedHighlights(storyEl);
                restoreSlots(storyEl);
            }
            updateCounts();
        }

        // 构建场景的所有行 DOM
        function buildStoryDom(scene) {
            storySceneId = state.scene;
            const lines = scene.story.split('\n').map(s => s.trim()).filter(Boolean);
            storyDom = lines.map(html => {
                const div = document.createElement('div');
                div.innerHTML = html;
                markCollectedHighlights(div);
                restoreSlots(div);
                // 绑定线索/物品高亮点击
                div.querySelectorAll('.clue-highlight').forEach(el => {
                    el.removeEventListener('click', handleClueClick);
                    el.addEventListener('click', handleClueClick);
                });
                // 笔记高亮：hover / 按压显示弹窗内容（点击不拦截，放行推进）
                div.querySelectorAll('.note-highlight').forEach(el => {
                    el.removeEventListener('mouseenter', showNotePop);
                    el.removeEventListener('mouseleave', hideNotePop);
                    el.removeEventListener('pointerdown', showNotePop);
                    el.removeEventListener('pointerup', hideNotePop);
                    el.addEventListener('mouseenter', showNotePop);
                    el.addEventListener('mouseleave', hideNotePop);
                    el.addEventListener('pointerdown', showNotePop);
                    el.addEventListener('pointerup', hideNotePop);
                    el.addEventListener('pointercancel', hideNotePop);
                    el.addEventListener('pointerleave', hideNotePop);
                });
                // 人物高亮：未加入人物框时高亮可点击，已加入则划线
                div.querySelectorAll('.char-highlight').forEach(el => {
                    const charId = el.dataset.char;
                    if (state.characters.includes(charId)) {
                        el.classList.add('collected');
                        el.removeEventListener('click', handleCharClick);
                    } else {
                        el.removeEventListener('click', handleCharClick);
                        el.addEventListener('click', handleCharClick);
                    }
                });
                return div;
            });
            if (storyDom.length === 0) {
                const div = document.createElement('div');
                div.innerHTML = '<div class="narr-line">（场景为空）</div>';
                storyDom.push(div);
            }
            storyEl.innerHTML = '';
            lineIndex = 0;
            blocked = false;
            stopTyping();
            // 初始静态提示行已由 JS 接管，恢复显示（由上层切换淡入）
            storyEl.style.opacity = '';

            // 第一行作为章节标题直接显示（非打字机）
            const title = storyDom[0];
            title.classList.add('chapter-title');
            lineIndex = 1;
            storyEl.appendChild(title);

            // 底部推进提示（放最后，避免被裁剪循环移除）
            storyEl.appendChild(storyHint);
            storyHint.textContent = '▾ 点击空白处推进剧情';

            // 只有标题行的场景：直接视为读完，自动完成
            if (lineIndex >= storyDom.length) {
                completeScene(SCENES[state.scene]);
            }
        }

        // 笔记高亮：hover / 长按显示弹窗内容
        function showNotePop(e) {
            const el = e.currentTarget;
            const noteId = el.dataset.note;
            const note = DATA.notes[noteId];
            if (!note) return;
            notePopTitle.textContent = note.name;
            notePopBody.textContent = note.detail;
            const rect = el.getBoundingClientRect();
            notePop.style.display = 'block';
            const pw = notePop.offsetWidth;
            const ph = notePop.offsetHeight;
            let left = rect.left;
            let top = rect.bottom + 8;
            if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
            if (top + ph > window.innerHeight - 8) top = rect.top - ph - 8;
            if (top < 8) top = 8;
            notePop.style.left = left + 'px';
            notePop.style.top = top + 'px';
        }

        function hideNotePop() {
            notePop.style.display = 'none';
        }

        // 人物高亮点击：加入人物框
        function handleCharClick(e) {
            e.stopPropagation();
            const el = e.currentTarget;
            const charId = el.dataset.char;
            if (state.characters.includes(charId)) return;
            if (unlockChar(charId)) {
                // 立即划线标记
                el.classList.add('collected');
                el.removeEventListener('click', handleCharClick);
            }
        }

        // 逐字打字机效果
        function startTyping(line, done) {
            const walker = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
            const nodes = [];
            while (walker.nextNode()) {
                const n = walker.currentNode;
                if (n.nodeValue && n.nodeValue.trim()) {
                    n.__full = n.nodeValue;
                    n.nodeValue = '';
                    nodes.push(n);
                }
            }
            if (nodes.length === 0) {
                if (done) done();
                return;
            }
            typingNodes = nodes;
            typingDoneCb = done;
            let ni = 0;
            let pos = 0;
            typingTimer = setInterval(function() {
                const n = nodes[ni];
                n.nodeValue = n.__full.slice(0, ++pos);
                if (pos >= n.__full.length) {
                    ni++;
                    pos = 0;
                    if (ni >= nodes.length) finishTyping();
                }
            }, TYPE_MS);
        }

        // 立即完成当前打字（点击跳过）
        function finishTyping() {
            if (typingTimer) {
                clearInterval(typingTimer);
                typingTimer = null;
            }
            typingNodes.forEach(n => { n.nodeValue = n.__full; });
            typingNodes = [];
            const cb = typingDoneCb;
            typingDoneCb = null;
            if (cb) cb();
        }

        function stopTyping() {
            if (typingTimer) {
                clearInterval(typingTimer);
                typingTimer = null;
            }
            typingNodes.forEach(n => { if (n.__full) n.nodeValue = n.__full; });
            typingNodes = [];
            typingDoneCb = null;
        }

        // 显示下一行（打字机），到底后重头开始
        function showNextLine() {
            if (storyDom.length === 0) return; // 场景尚未构建完成（如开场淡入窗口）时安全跳过
            if (lineIndex >= storyDom.length) {
                storyEl.innerHTML = '';
                lineIndex = 0;
            }
            const line = storyDom[lineIndex];
            lineIndex++;
            storyEl.appendChild(line);
            // 按实际高度裁剪：超出剧情框高度的最旧行移除，保留底部留白
            let guard = 0;
            while (storyEl.scrollHeight > storyEl.clientHeight + 2 && storyEl.children.length > 2 && guard < 50) {
                storyEl.removeChild(storyEl.firstChild);
                guard++;
            }
            startTyping(line, function() {
                // 打完一行：若行内含未填空槽，阻塞推进
                if (line.querySelector('.slot:not(.filled)')) {
                    blocked = true;
                    storyHint.textContent = '▾ 填入空缺内容后继续';
                    showToast('此处需要填入线索才能继续', '');
                    return;
                }
                // 读完最后一行：全部填空位都已填入才视为场景完成
                if (lineIndex >= storyDom.length) {
                    const scene = SCENES[state.scene];
                    const cfg = (scene && scene.slotConfigs) || [];
                    if (cfg.every(c => state.usedBlockIds.has(c.expected))) {
                        completeScene(scene);
                    }
                }
            });
        }

        // ---------- 章节档案（回顾）：每完成一个章节记录一次纯文本，可折叠通读 ----------
        let sceneRecords = []; // [{ sceneId, title, lines: [纯文本行] }]

        // 场景完成时记录一次（已记录则跳过）
        function recordFinishedScene(sceneId) {
            const scene = SCENES[sceneId];
            if (!scene) return;
            if (sceneRecords.find(r => r.sceneId === sceneId)) return;
            const htmlLines = scene.story.split('\n').map(s => s.trim()).filter(Boolean);
            const title = extractSceneTitle(htmlLines[0]);
            const lines = htmlLines.slice(1).map(html => {
                const div = document.createElement('div');
                div.innerHTML = html;
                // 填空位替换为答案文字，其余高亮只留文字
                div.querySelectorAll('.slot').forEach(sl => {
                    const block = state.allBlocks.find(b => b.id === sl.dataset.expect);
                    sl.textContent = block ? block.label : '______';
                });
                return div.textContent.trim();
            }).filter(Boolean);
            sceneRecords.push({ sceneId: sceneId, title: title, lines: lines });
            if (openDrawer === 'history') renderHistory();
        }

        // 从章节标题行提取章节名（✦ 章名 ✦）
        function extractSceneTitle(html) {
            const m = String(html).match(/✦\s*([^✦]+)\s*✦/);
            return m ? m[1].trim() : '未命名章节';
        }

        // 渲染章节档案（抽屉内，章节头可折叠展开）
        function renderHistory() {
            const body = historyBody;
            body.innerHTML = '';
            if (sceneRecords.length === 0) {
                body.innerHTML = '<div class="empty">每完成一个章节就会记录在这里，完成后可完整通读</div>';
                return;
            }
            sceneRecords.forEach(record => {
                const sec = document.createElement('div');
                sec.className = 'hist-scene collapsed';
                const head = document.createElement('div');
                head.className = 'hist-scene-head';
                head.innerHTML = `<span class="hist-scene-title">${record.title}</span><span class="hist-scene-arrow">▸</span>`;
                head.addEventListener('click', function() {
                    sec.classList.toggle('collapsed');
                });
                sec.appendChild(head);
                const itemsWrap = document.createElement('div');
                itemsWrap.className = 'hist-scene-body';
                record.lines.forEach(line => {
                    const p = document.createElement('p');
                    p.className = 'hist-line';
                    p.textContent = line;
                    itemsWrap.appendChild(p);
                });
                sec.appendChild(itemsWrap);
                body.appendChild(sec);
            });
        }

        // 已收集线索/物品的高亮：改为同色划线（书籍划线感），不替换为纯文本
        function markCollectedHighlights(root) {
            state.clues.concat(state.items).forEach(c => {
                const els = root.querySelectorAll(`.clue-highlight[data-clue="${c.id}"]`);
                els.forEach(el => el.classList.add('collected'));
            });
        }

        // 恢复已填的槽
        function restoreSlots(root) {
            state.slotConfigs.forEach(cfg => {
                const el = root.querySelector(`.slot[data-slot="${cfg.id}"]`);
                if (el && state.usedBlockIds.has(cfg.expected)) {
                    el.dataset.filled = 'true';
                    el.dataset.content = cfg.expected;
                    let label = cfg.expected;
                    let realBlockId = cfg.expected;
                    if (cfg.pickup === 'item' && DATA.items[cfg.expected]) {
                        label = DATA.items[cfg.expected].name;
                        realBlockId = 'item_' + cfg.expected; // 拾取型物品：保留在物品栏，不进 placedIds
                    } else if (cfg.pickup === 'char' && DATA.characters[cfg.expected]) {
                        label = DATA.characters[cfg.expected].name;
                        realBlockId = 'char_' + cfg.expected; // 拾取型人物：保留在人物栏，不进 placedIds
                    } else {
                        const block = state.allBlocks.find(b => b.id === cfg.expected) ||
                            state.allBlocks.find(b => b.sourceId === cfg.expected);
                        if (block) { label = block.label; realBlockId = block.id; }
                        // 非拾取：正在空位中的卡从栏位隐藏，回退即恢复
                        state.placedIds.add(realBlockId);
                    }
                    el.dataset.filledBlock = realBlockId;
                    el.innerHTML = `<span class="slot-content">${label}</span><span class="slot-undo" title="回到填空之前">↺</span>`;
                    el.classList.add('filled');
                }
            });
        }

        // 点击空白处：跳过打字 / 推进下一行 / 进入下一场景（被填空阻塞时不可推进）
        storyEl.addEventListener('click', function(e) {
            // 点 ↺：回到填空之前（清除该空位的填入，可重新拖入）
            const undo = e.target.closest('.slot-undo');
            if (undo) {
                e.stopPropagation();
                clearSlot(undo.closest('.slot'));
                return;
            }
            // 已填好的空位：只通过 ↺ 才能回到填空之前，点击本身不弹出选择器
            const filledSlot = e.target.closest('.slot.filled');
            if (filledSlot) return;
            // 点击未填空槽：物品/人物类为「拾取」，点击直接收集；其他弹出选择器
            const slotEl = e.target.closest('.slot');
            if (slotEl) {
                if (slotEl.dataset.pickup) {
                    fillPickupSlot(slotEl);
                } else {
                    openFillModal(slotEl);
                }
                return;
            }
            if (e.target.closest('.clue-highlight') || e.target.closest('.char-highlight') ||
                e.target.closest('.drag-block') || e.target.closest('button')) return;
            if (blocked) {
                showToast('请先填入空缺内容，才能继续阅读', '');
                return;
            }
            if (pendingScene) {
                const next = pendingScene;
                pendingScene = null;
                loadScene(next);
                return;
            }
            if (typingTimer) {
                finishTyping();
                return;
            }
            showNextLine();
        });

        function renderClues() {
            // 线索栏：点击剧情高亮词收集，可拖入主剧情填空
            // 普通线索填入后保留（可反复使用）；仅 removeAfterFill 的线索才从列表隐藏
            const pickItems = state.allBlocks.filter(b =>
                b.type === 'clue' && !state.consumedIds.has(b.id) && !state.placedIds.has(b.id));
            if (pickItems.length === 0) {
                cluePick.innerHTML = '<div class="empty">线索只有点击剧情中的高亮词才能获得</div>';
            } else {
                cluePick.innerHTML = pickItems.map(block => {
                    const sel = state.selectedClueIds.indexOf(block.id) > -1;
                    const ownerLabel = block.owner === 'wu' ? '吴秋崖' : block.owner === 'shan' ? '商难' : '通用';
                    const ownerClass = block.owner === 'wu' ? 'wu' : block.owner === 'shan' ? 'shan' : 'all';
                    return `
                        <div class="drag-block clue-item selectable ${sel ? 'selected' : ''}" data-block="${block.id}" data-type="clue" data-owner="${block.owner}">
                            ${block.label}
                            <span class="block-type">线索</span>
                            <span class="owner-tag ${ownerClass}">${ownerLabel}</span>
                            <div class="block-detail">${block.detail}</div>
                        </div>
                    `;
                }).join('');
                cluePick.querySelectorAll('.clue-item').forEach(el => {
                    el.addEventListener('click', function () { toggleSelectClue(el.dataset.block); });
                });
            }

            // 推理结果：由「组合推理」产出的卡片，可拖入剧情框的空白处填空（默认保留，可反复使用）
            let items = state.allBlocks.filter(b =>
                b.type === 'reason' && !state.consumedIds.has(b.id) && !state.placedIds.has(b.id));
            if (items.length === 0) {
                clueList.innerHTML = '<div class="empty">推理结果由「组合推理」产出，可拖入剧情填空</div>';
            } else {
                clueList.innerHTML = items.map(block => {
                    const ownerLabel = block.owner === 'wu' ? '吴秋崖' : block.owner === 'shan' ? '商难' : '通用';
                    const ownerClass = block.owner === 'wu' ? 'wu' : block.owner === 'shan' ? 'shan' : 'all';
                    return `
                        <div class="drag-block" data-block="${block.id}" data-type="reason" data-owner="${block.owner}">
                            ${block.label}
                            <span class="block-type">推理</span>
                            <span class="owner-tag ${ownerClass}">${ownerLabel}</span>
                            <div class="block-detail">${block.detail}</div>
                        </div>
                    `;
                }).join('');
            }
            reasonTitleCount.textContent = `(${items.length})`;
            // 选中至少两条线索才允许组合
            combineBtn.disabled = state.selectedClueIds.length < 2;

            // 重建后刷新所有拖拽块的 draggable 属性
            refreshDraggable();
        }

        function renderItems() {
            let items = state.allBlocks.filter(b => b.type === 'item' && !state.consumedIds.has(b.id) && !state.placedIds.has(b.id));
            if (items.length === 0) {
                itemList.innerHTML = '<div class="empty">点击剧情中的高亮词收集物品</div>';
                itemCountBadge.textContent = '0';
                return;
            }
            let html = '';
            items.forEach(block => {
                const ownerLabel = block.owner === 'wu' ? '吴秋崖' : block.owner === 'shan' ? '商难' : '通用';
                const ownerClass = block.owner === 'wu' ? 'wu' : block.owner === 'shan' ? 'shan' : 'all';
                html += `
                    <div class="drag-block" data-block="${block.id}" data-type="item" data-owner="${block.owner}">
                        ${block.label}
                        <span class="block-type">物品</span>
                        <span class="owner-tag ${ownerClass}">${ownerLabel}</span>
                        <div class="block-detail">${block.detail}</div>
                    </div>
                `;
            });
            itemList.innerHTML = html;
            itemCountBadge.textContent = items.length;
        }

        function renderCharacters() {
            // 仅显示已点击加入的人物
            let items = state.allBlocks.filter(b =>
                b.type === 'char' && b.sourceId && state.characters.includes(b.sourceId) && !state.consumedIds.has(b.id) && !state.placedIds.has(b.id));
            if (items.length === 0) {
                charList.innerHTML = '<div class="empty">点击剧情中的人物高亮词，将其加入人物框</div>';
                charCountBadge.textContent = '0';
                return;
            }
            let html = '';
            items.forEach(block => {
                const charId = block.sourceId;
                const data = DATA.characters[charId];
                if (!data) return;
                // 与线索/物品卡片样式一致（未勾选「填空后删除」的人物可反复拖动）
                html += `
                    <div class="drag-block" data-block="${block.id}" data-type="char" data-owner="${block.owner}">
                        ${data.name}
                        <span class="block-type">人物</span>
                        <span class="owner-tag all">${data.role}</span>
                        <div class="block-detail">${data.desc}　${data.info}</div>
                    </div>
                `;
            });
            charList.innerHTML = html;
            charCountBadge.textContent = items.length;
        }

        // 刷新所有拖拽块的 draggable 属性（线索 / 推理 / 物品 / 人物均可拖）
        function refreshDraggable() {
            document.querySelectorAll('.drag-block:not(.used)').forEach(el => {
                el.setAttribute('draggable', 'true');
            });
        }

        // ---------- 高亮点击 ----------
        function handleClueClick(e) {
            const el = e.currentTarget;
            const id = el.dataset.clue;
            if (state.clues.find(c => c.id === id) || state.items.find(i => i.id === id)) return;
            const owner = currentSceneOwner || 'wu';
            let added = false;
            let kind = '';
            let name = id;
            if (DATA.items[id]) {
                added = addItem(id, owner);
                kind = '物品';
                name = DATA.items[id].name;
            } else if (DATA.clues[id]) {
                added = addClue(id, owner);
                kind = '线索';
                name = DATA.clues[id].name;
            }
            if (added) {
                // 收集成功：立即划线标记（书籍划线感）
                el.classList.add('collected');
            }
        }

        // ---------- 声明式场景完成（原 onComplete 改为 toasts/rewards/goto 数据） ----------
        function completeScene(scene) {
            if (completedScenes.has(scene.id)) {
                // 重入（如重进已完成场景）：仅恢复跳转状态，不重复发放
                if (scene.goto) {
                    pendingScene = scene.goto;
                    storyHint.textContent = scene.nextHint || '▾ 点击继续';
                }
                return;
            }
            completedScenes.add(scene.id);
            const owner = scene.owner || 'wu';
            (scene.toasts || []).forEach(t => {
                showToast(t.text, t.type || 'success');
            });
            (scene.rewards || []).forEach(r => {
                if (r.type === 'note') addNote(r.id, owner);
                else if (r.type === 'clue') addClue(r.id, owner);
                else if (r.type === 'item') addItem(r.id, owner);
            });
            recordFinishedScene(scene.id);
            if (scene.goto) {
                pendingScene = scene.goto;
                storyHint.textContent = scene.nextHint || '▾ 点击继续';
            }
        }

        // ---------- 场景完成统一规则：剧情读到结尾即完成（填空是途中的阻塞关） ----------
        function updateCounts() {
            const items = state.allBlocks.filter(b => b.type === 'clue' && !state.consumedIds.has(b.id) && !state.placedIds.has(b.id));
            reasonCount.textContent = items.length;
        }

        // ---------- 加载场景 ----------
        // 场景初始块（initBlocks）：进入场景时登记为可用卡片（推理/线索等），可拖入填空
        function ensureInitBlocks(scene) {
            if (!scene || !scene.initBlocks) return;
            scene.initBlocks.forEach(function (b) {
                // 物品/人物类 initBlock 是「可拾取物」，不预置进栏，由剧情填空点击收集
                if (DATA.items && DATA.items[b.id]) return;
                if (DATA.characters && DATA.characters[b.id]) return;
                if (!state.allBlocks.find(function (x) { return x.id === b.id; })) {
                    state.allBlocks.push({
                        id: b.id,
                        type: b.type || 'reason',
                        label: b.label || b.id,
                        detail: b.detail || '',
                        sourceId: b.id,
                        sourceType: b.type || 'reason',
                        owner: b.owner || 'all'
                    });
                }
            });
        }

        function loadScene(sceneId) {
            state.scene = sceneId;
            pendingScene = null;
            const scene = SCENES[sceneId];
            if (scene) {
                currentSceneOwner = scene.owner || 'wu';
                ensureInitBlocks(scene);
            }
            renderAll();
        }

        // ---------- 开始推理按钮（激活小剧场） ----------
        combineBtn.addEventListener('click', performCombine);

        // ---------- 拖拽事件委托（核心修复） ----------
        app.addEventListener('dragstart', function(e) {
            const target = e.target.closest('.drag-block:not(.used)');
            if (!target) return;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', target.dataset.block);
            target.classList.add('dragging');
        });

        app.addEventListener('dragend', function(e) {
            const target = e.target.closest('.drag-block');
            if (target) target.classList.remove('dragging');
        });

        app.addEventListener('dragover', function(e) {
            const slot = e.target.closest('.slot:not(.filled)');
            if (slot) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                slot.classList.add('drag-over');
            }
        });

        app.addEventListener('dragleave', function(e) {
            const slot = e.target.closest('.slot');
            if (slot) slot.classList.remove('drag-over');
        });

        // ---------- 填空核心逻辑（拖拽与点击选择器共用） ----------
        // 取卡片对应的数据配置（线索/物品/人物），用于「填空后删除」判定
        function blockData(block) {
            if (!block || !block.sourceType) return null;
            if (block.sourceType === 'clue') return DATA.clues[block.sourceId];
            if (block.sourceType === 'item') return DATA.items[block.sourceId];
            if (block.sourceType === 'char') return DATA.characters[block.sourceId];
            return null;
        }
        // 尝试用 blockId 填充 slot，成功返回 true
        // 多答案分支：场景的 slotBranches[ref] 可把不同卡片导向 correct / wrong(分支) 结局
        function fillSlot(slot, blockId) {
            const block = state.allBlocks.find(b => b.id === blockId);
            if (!block) return false;
            const scene = SCENES[state.scene];
            const ref = slot.dataset.ref;
            const branchMap = (scene && scene.slotBranches && ref) ? scene.slotBranches[ref] : null;
            let matched = false, branchEntry = null;
            if (branchMap) {
                branchEntry = branchMap[blockId] || (block ? branchMap[block.label] : null);
                if (branchEntry) {
                    matched = true;
                } else if (blockId === slot.dataset.expect || (slot.dataset.answer && block.label === slot.dataset.answer)) {
                    // 不在分支表里，但恰是期望块：按正确处理
                    matched = true;
                    branchEntry = (branchMap[slot.dataset.expect] || { correct: true });
                }
            } else {
                matched = blockId === slot.dataset.expect || (block && slot.dataset.answer && block.label === slot.dataset.answer);
            }
            if (!matched) return false;

            // 记录填充：filledBlock 用真实块 id（便于从栏位隐藏与回退恢复）
            slot.dataset.filled = 'true';
            slot.dataset.content = blockId;
            slot.dataset.filledBlock = block.id;
            const showBlock = state.allBlocks.find(b => b.id === blockId) || block;
            if (!showBlock) return true;
            slot.innerHTML = `<span class="slot-content">${showBlock.label}</span><span class="slot-undo" title="回到填空之前">↺</span>`;
            slot.classList.add('filled');
            // 完成追踪：记录该空位的 expect
            state.usedBlockIds.add(slot.dataset.expect);
            // 该卡正放置在空位中：从栏位隐藏（回退即恢复，可反复使用）
            state.placedIds.add(block.id);
            // 从组合选中移除（已使用的块不再可选）
            const selIdx = state.selectedClueIds.indexOf(blockId);
            if (selIdx > -1) state.selectedClueIds.splice(selIdx, 1);

            // 错误分支：在剧情框追加一段不同走向，并阻塞等待「回到填空之前」
            if (branchEntry && branchEntry.wrong) {
                slot.classList.add('branch-wrong');
                slot.classList.remove('correct-flash');
                if (branchEntry.line) appendBranchLine(slot, branchEntry.line);
                blocked = true;
                storyHint.textContent = '▾ 点空位上的 ↺ 回到填空之前，换一种填法';
                showToast('这条填法引向另一条线索……', '');
                renderClues(); renderItems(); renderCharacters(); updateCounts(); refreshDraggable();
                return true;
            }

            // 正确分支：原流程
            slot.classList.add('correct-flash');
            // 立即刷新各面板，不等整体刷新
            renderClues();
            renderItems();
            renderCharacters();
            updateCounts();
            refreshDraggable();
            // 填空正确后：解除阻塞，等待玩家点击推进下一行
            if (blocked) {
                const lineEl = (function() {
                    let el = slot.parentNode;
                    while (el && el.parentNode !== storyEl) el = el.parentNode;
                    return el;
                })();
                const stillEmpty = lineEl ? lineEl.querySelector('.slot:not(.filled)') : false;
                if (!stillEmpty) {
                    blocked = false;
                    storyHint.textContent = '▾ 点击空白处推进剧情';
                }
            }
            // 若剧情已读到结尾，最后一个槽填满即完成场景
            if (lineIndex >= storyDom.length) {
                const sc = SCENES[state.scene];
                const cfg = (sc && sc.slotConfigs) || [];
                if (cfg.every(c => state.usedBlockIds.has(c.expected))) {
                    completeScene(sc);
                }
            }
            return true;
        }

        // 在剧情框里追加一段分支反应行（用 branchfor 标记，便于撤销时移除）
        function appendBranchLine(slot, text) {
            let lineEl = slot.parentNode;
            while (lineEl && lineEl.parentNode !== storyEl) lineEl = lineEl.parentNode;
            if (!lineEl) return;
            const br = document.createElement('div');
            br.className = 'branch-line';
            br.dataset.branchfor = slot.dataset.slot;
            br.textContent = text;
            if (lineEl.nextSibling) storyEl.insertBefore(br, lineEl.nextSibling);
            else storyEl.appendChild(br);
        }

        // 回到填空之前：清空某空位的填入，恢复被消耗的卡片，可重新拖入
        function clearSlot(slot) {
            const filledBlock = slot.dataset.filledBlock;
            const slotId = slot.dataset.slot;
            slot.classList.remove('filled', 'correct-flash', 'wrong-flash', 'branch-wrong');
            slot.dataset.filled = '';
            slot.dataset.content = '';
            slot.dataset.filledBlock = '';
            slot.innerHTML = '<span class="placeholder">______</span>';
            // 移除分支反应行
            const br = storyEl.querySelector('.branch-line[data-branchfor="' + slotId + '"]');
            if (br) br.remove();
            // 回到填空之前：仅清空空位，绝不删除任何卡片（线索/物品/人物后续仍可能用到）
            // 该卡从「正放置」集合移除 → 立即在栏位恢复显示，可重新拖入
            if (filledBlock) {
                state.usedBlockIds.delete(filledBlock);
                state.usedBlockIds.delete(slot.dataset.expect); // 拾取型以期望 id 记录，需一并清除
                state.placedIds.delete(filledBlock);
            }
            // 重新评估阻塞
            const anyEmpty = Array.prototype.some.call(
                storyEl.querySelectorAll('.slot'),
                function (s) { return !s.classList.contains('filled'); });
            if (anyEmpty) {
                blocked = true;
                storyHint.textContent = '▾ 填入空缺内容后继续';
            } else {
                blocked = false;
                storyHint.textContent = '▾ 点击空白处推进剧情';
            }
            renderClues(); renderItems(); renderCharacters(); updateCounts(); refreshDraggable();
        }

        // 拾取型填空：点击空位收集该物品/人物
        // 若该空位在场景 slotBranches 中配置了多个选项（正确物品 + 错误分支物品/人物），
        // 则先弹出选择框，让玩家选填哪个；不同选择引向不同剧情分支。
        function fillPickupSlot(slot) {
            const ref = slot.dataset.expect;
            const kind = slot.dataset.pickup; // 'item' | 'char'
            const scene = SCENES[state.scene];
            const branchMap = (scene && scene.slotBranches && ref) ? scene.slotBranches[ref] : null;
            let keys, map;
            if (branchMap) {
                keys = Object.keys(branchMap);
                map = branchMap;
            } else {
                // 未配置分支：仍弹选择框，列出正确项，绝不直接填入
                keys = [ref];
                map = {};
                map[ref] = { correct: true };
            }
            openPickupChoice(slot, keys, map, kind);
        }

        // 把 key（物品/人物 id 或 name）解析为实际 id
        function resolvePickupRef(kind, key) {
            const table = kind === 'item' ? DATA.items : DATA.characters;
            if (!table) return null;
            if (table[key]) return key;
            for (const id in table) {
                if (table[id] && table[id].name === key) return id;
            }
            return null;
        }

        // 弹出选择框（多个选项时）
        function openPickupChoice(slot, keys, branchMap, kind) {
            pickupChoiceList.innerHTML = '';
            keys.forEach(function (key) {
                const entry = branchMap[key] || { correct: true };
                const id = resolvePickupRef(kind, key);
                if (!id) return; // 无法解析的选项错误跳过
                const nm = (kind === 'item' ? (DATA.items[id] && DATA.items[id].name) : (DATA.characters[id] && DATA.characters[id].name)) || key;
                const item = document.createElement('div');
                item.className = 'fill-item' + (entry.correct ? '' : ' alt-item');
                item.innerHTML = nm + '<span class="block-type">' + BLOCK_TYPE_NAME[kind] + '</span>';
                item.addEventListener('click', function () {
                    closePickupChoice();
                    doPickupFill(slot, id, kind, entry);
                    if (slot.classList.contains('branch-wrong')) {
                        showToast('这条填法引向另一条线索……', '');
                    } else {
                        showToast('✓ 填入「' + nm + '」成功！', 'success');
                    }
                });
                pickupChoiceList.appendChild(item);
            });
            if (pickupChoiceList.children.length === 0) {
                // 没有可解析的选项，回退为直接收集期望
                doPickupFill(slot, slot.dataset.expect, kind, branchMap[slot.dataset.expect] || null);
                return;
            }
            pickupChoiceModal.classList.add('open');
        }
        function closePickupChoice() {
            pickupChoiceModal.classList.remove('open');
            pickupChoiceList.innerHTML = '';
        }

        // 实际收集并填入（含正确/错误分支处理）
        function doPickupFill(slot, chosenRef, kind, entry) {
            const isCorrect = !entry || entry.correct;
            let ok = false;
            if (kind === 'item') {
                if (state.items.find(function (i) { return i.id === chosenRef; })) ok = true;
                else ok = addItem(chosenRef);
            } else if (kind === 'char') {
                if (state.characters.indexOf(chosenRef) > -1) ok = true;
                else ok = unlockChar(chosenRef);
            }
            if (!ok) {
                showToast('无法记录该' + (kind === 'item' ? '物品' : '人物'), 'error');
                return;
            }
            slot.dataset.filled = 'true';
            slot.dataset.content = chosenRef;
            slot.dataset.filledBlock = (kind === 'item' ? 'item_' : 'char_') + chosenRef;
            const name = kind === 'item'
                ? (DATA.items[chosenRef] && DATA.items[chosenRef].name)
                : (DATA.characters[chosenRef] && DATA.characters[chosenRef].name);
            slot.innerHTML = '<span class="slot-content">' + (name || chosenRef) + '</span><span class="slot-undo" title="回到填空之前">↺</span>';
            slot.classList.add('filled');
            // 完成追踪：仅正确填法计入场景完成条件
            if (isCorrect) state.usedBlockIds.add(slot.dataset.expect);
            else {
                slot.classList.add('branch-wrong');
                slot.classList.remove('correct-flash');
            }
            const selIdx = state.selectedClueIds.indexOf(chosenRef);
            if (selIdx > -1) state.selectedClueIds.splice(selIdx, 1);

            // 分支反应文字（正确或错误均可附带）
            if (entry && entry.line) appendBranchLine(slot, entry.line);

            if (!isCorrect) {
                // 错误分支：阻塞，等待玩家点 ↺ 回到填空之前重填
                blocked = true;
                storyHint.textContent = '▾ 点空位上的 ↺ 回到填空之前，换一种填法';
                showToast('这条填法引向另一条线索……', '');
            } else {
                // 解除阻塞
                if (blocked) {
                    const lineEl = (function () {
                        let el = slot.parentNode;
                        while (el && el.parentNode !== storyEl) el = el.parentNode;
                        return el;
                    })();
                    const stillEmpty = lineEl ? lineEl.querySelector('.slot:not(.filled)') : false;
                    if (!stillEmpty) {
                        blocked = false;
                        storyHint.textContent = '▾ 点击空白处推进剧情';
                    }
                }
                // 若剧情已读到结尾，最后一个槽填满即完成场景
                if (lineIndex >= storyDom.length) {
                    const sc = SCENES[state.scene];
                    const cfg = (sc && sc.slotConfigs) || [];
                    if (cfg.every(function (c) { return state.usedBlockIds.has(c.expected); })) {
                        completeScene(sc);
                    }
                }
            }
            renderClues(); renderItems(); renderCharacters(); updateCounts(); refreshDraggable();
        }


        // 拖入物品/人物卡到拾取型空位（与点击选择框共用 doPickupFill）
        function rejectPickup(slot, msg) {
            slot.classList.add('wrong-flash');
            showToast(msg || '这个不适用于此处', 'error');
            setTimeout(function () { slot.classList.remove('wrong-flash'); }, 500);
        }
        function handlePickupDrop(slot, blockId) {
            const m = /^([a-z]+)_(.+)$/.exec(blockId || '');
            if (!m) { rejectPickup(slot); return; }
            const pfx = m[1], id = m[2];
            const kind = slot.dataset.pickup; // 'item' | 'char'
            if ((kind === 'item' && pfx !== 'item') || (kind === 'char' && pfx !== 'char')) {
                rejectPickup(slot, '这里要填' + (kind === 'item' ? '物品' : '人物') + '，不是这个');
                return;
            }
            const ref = slot.dataset.expect; // 期望的物品/人物裸 id
            const scene = SCENES[state.scene];
            const branchMap = (scene && scene.slotBranches && ref) ? scene.slotBranches[ref] : null;
            let entry = null;
            if (branchMap) {
                const nm = (kind === 'item' ? (DATA.items[id] && DATA.items[id].name) : (DATA.characters[id] && DATA.characters[id].name)) || '';
                entry = branchMap[blockId] || branchMap[id] || (nm && branchMap[nm]) || null;
                if (!entry && id === ref) entry = branchMap[ref] || { correct: true };
                if (!entry) { rejectPickup(slot, '这个不适用于此处'); return; }
            } else {
                if (id !== ref) { rejectPickup(slot, '这个不适用于此处'); return; }
                entry = { correct: true };
            }
            doPickupFill(slot, id, kind, entry);
            if (slot.classList.contains('branch-wrong')) showToast('这条填法引向另一条线索……', '');
            else {
                const nm = (kind === 'item' ? (DATA.items[id] && DATA.items[id].name) : (DATA.characters[id] && DATA.characters[id].name)) || id;
                showToast('✓ 填入「' + nm + '」成功！', 'success');
            }
        }

        // ---------- 填空选择器（触屏点击填充；桌面端点击槽位同样可用） ----------
        const BLOCK_TYPE_NAME = { clue: '线索', reason: '推理', item: '物品', char: '人物', note: '笔记' };

        function openFillModal(slotEl) {
            // 已「填空后删除」(removeAfterFill) 消耗的卡片不再作为候选；普通卡可反复选择
            const candidates = state.allBlocks.filter(b => !state.consumedIds.has(b.id) && !state.placedIds.has(b.id))
                .filter(b => b.type === 'clue' || b.type === 'reason' || b.type === 'item' || b.type === 'char');
            if (candidates.length === 0) {
                fillList.innerHTML = '<div class="empty">没有可用的卡片，请先点击剧情中的高亮词收集，或通过组合推理获得</div>';
            } else {
                fillList.innerHTML = '';
                candidates.forEach(block => {
                    const item = document.createElement('div');
                    item.className = 'fill-item';
                    item.innerHTML = `${block.label}<span class="block-type">${BLOCK_TYPE_NAME[block.type] || '卡片'}</span>`;
                    item.addEventListener('click', function() {
                        if (fillSlot(slotEl, block.id)) {
                            closeFillModal();
                            if (slotEl.classList.contains('branch-wrong')) {
                                showToast('这条填法引向另一条线索……', '');
                            } else {
                                showToast(`✓ 填入「${block.label}」成功！`, 'success');
                            }
                        } else {
                            item.classList.add('wrong-flash');
                            showToast('❌ 这个块不适合这个位置', 'error');
                            setTimeout(() => item.classList.remove('wrong-flash'), 500);
                        }
                    });
                    fillList.appendChild(item);
                });
            }
            fillModal.classList.add('open');
        }

        function closeFillModal() {
            fillModal.classList.remove('open');
            fillList.innerHTML = '';
        }

        fillClose.addEventListener('click', closeFillModal);
        fillModal.addEventListener('click', function(e) {
            if (e.target === fillModal) closeFillModal();
        });

        pickupChoiceClose.addEventListener('click', closePickupChoice);
        pickupChoiceModal.addEventListener('click', function(e) {
            if (e.target === pickupChoiceModal) closePickupChoice();
        });

        app.addEventListener('drop', function(e) {
            e.preventDefault();
            const slot = e.target.closest('.slot:not(.filled)');
            if (!slot) return;
            slot.classList.remove('drag-over');

            const blockId = e.dataTransfer.getData('text/plain');
            if (!blockId) {
                showToast('无效的拖拽', 'error');
                return;
            }

            // 拾取型空位（物品/人物）：点击或拖入都走选择逻辑，绝不直接填入
            if (slot.dataset.pickup) {
                handlePickupDrop(slot, blockId);
                return;
            }

            if (fillSlot(slot, blockId)) {
                if (slot.classList.contains('branch-wrong')) {
                    showToast('这条填法引向另一条线索……', '');
                } else {
                    const showBlock = state.allBlocks.find(b => b.id === slot.dataset.expect);
                    showToast(`✓ 填入「${showBlock ? showBlock.label : slot.dataset.answer}」成功！`, 'success');
                }
            } else {
                slot.classList.add('wrong-flash');
                showToast('❌ 这个块不适合这个位置，请尝试其他组合', 'error');
                setTimeout(() => slot.classList.remove('wrong-flash'), 500);
            }
        });

        // ---------- 存档（跨设备传输：复制文本 / 导出文件） ----------
        const btnCopySave = document.getElementById('btnCopySave');
        const btnPasteSave = document.getElementById('btnPasteSave');
        const btnExportSave = document.getElementById('btnExportSave');
        const btnImportSave = document.getElementById('btnImportSave');
        const saveModal = document.getElementById('saveModal');
        const saveClose = document.getElementById('saveClose');
        const saveInput = document.getElementById('saveInput');
        const saveErr = document.getElementById('saveErr');
        const saveFileInput = document.getElementById('saveFileInput');
        const saveConfirm = document.getElementById('saveConfirm');

        function serializeSave() {
            return JSON.stringify({
                v: 1,
                scene: state.scene,
                clues: state.clues,
                items: state.items,
                notes: state.notes,
                characters: state.characters,
                usedBlockIds: Array.from(state.usedBlockIds),
                placedIds: Array.from(state.placedIds),
                consumedIds: Array.from(state.consumedIds),
                allBlocks: state.allBlocks,
                selectedClueIds: state.selectedClueIds,
                combinedKeys: state.combinedKeys,
                completedScenes: Array.from(completedScenes),
                sceneRecords: sceneRecords,
                currentSceneOwner: currentSceneOwner
            });
        }

        function toBase64(str) {
            let bin = '';
            new TextEncoder().encode(str).forEach(function(b) { bin += String.fromCharCode(b); });
            return btoa(bin);
        }

        function fromBase64(b64) {
            const bin = atob(b64.trim());
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder().decode(bytes);
        }

        function parseSaveText(text) {
            let json = text.trim();
            try {
                json = fromBase64(json);
            } catch (e) { /* 非 base64，按原始 JSON 处理 */ }
            return JSON.parse(json);
        }

        function applySave(save) {
            if (!save || typeof save !== 'object' || !save.scene || !SCENES[save.scene]) {
                throw new Error('存档无效或对应场景不存在');
            }
            state.scene = save.scene;
            state.clues = Array.isArray(save.clues) ? save.clues : [];
            state.items = Array.isArray(save.items) ? save.items : [];
            state.notes = Array.isArray(save.notes) ? save.notes : [];
            state.characters = Array.isArray(save.characters) ? save.characters : [];
            state.usedBlockIds = new Set(Array.isArray(save.usedBlockIds) ? save.usedBlockIds : []);
            state.placedIds = new Set(Array.isArray(save.placedIds) ? save.placedIds : []);
            state.consumedIds = new Set(Array.isArray(save.consumedIds) ? save.consumedIds : []);
            state.allBlocks = Array.isArray(save.allBlocks) ? save.allBlocks : [];
            state.selectedClueIds = Array.isArray(save.selectedClueIds) ? save.selectedClueIds : [];
            state.combinedKeys = Array.isArray(save.combinedKeys) ? save.combinedKeys : [];
            completedScenes = new Set(Array.isArray(save.completedScenes) ? save.completedScenes : []);
            sceneRecords = Array.isArray(save.sceneRecords) ? save.sceneRecords : [];
            currentSceneOwner = save.currentSceneOwner || 'wu';
            pendingScene = null;
            stopTyping();
            storySceneId = null;
            loadScene(state.scene);
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            showToast(ok ? '存档已复制，可在其他设备粘贴导入' : '复制失败，请改用「导出文件」', ok ? 'success' : 'error');
        }

        btnCopySave.addEventListener('click', function() {
            const text = toBase64(serializeSave());
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('存档已复制，可在其他设备粘贴导入', 'success');
                }, function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        });

        btnPasteSave.addEventListener('click', function() {
            saveInput.value = '';
            saveErr.textContent = '';
            saveModal.classList.add('open');
            saveInput.focus();
        });

        saveClose.addEventListener('click', function() { saveModal.classList.remove('open'); });
        saveModal.addEventListener('click', function(e) {
            if (e.target === saveModal) saveModal.classList.remove('open');
        });

        saveConfirm.addEventListener('click', function() {
            const text = saveInput.value;
            if (!text.trim()) { saveErr.textContent = '请先粘贴存档文本'; return; }
            try {
                const save = parseSaveText(text);
                applySave(save);
                saveModal.classList.remove('open');
                showToast('✓ 存档已恢复', 'success');
            } catch (e) {
                saveErr.textContent = '导入失败：' + e.message;
            }
        });

        btnExportSave.addEventListener('click', function() {
            const blob = new Blob([serializeSave()], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'summerbird-save.json';
            a.click();
            setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
            showToast('已导出存档文件', 'success');
        });

        btnImportSave.addEventListener('click', function() { saveFileInput.click(); });
        saveFileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const save = JSON.parse(String(reader.result));
                    applySave(save);
                    showToast('✓ 存档已恢复', 'success');
                } catch (e) {
                    showToast('导入失败：' + e.message, 'error');
                }
            };
            reader.readAsText(file, 'utf-8');
            this.value = '';
        });

        // ---------- 启动 ----------
        loadScene(STORY.startScene || Object.keys(SCENES)[0] || 'wu_start');
    </script>
</body>
</html>
