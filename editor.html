<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凤尾庄 · 剧本编辑器</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #171310;
        color: #ddd2c2;
        font-family: 'Microsoft YaHei', 'SimHei', sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    /* ---------- 顶栏 ---------- */
    #topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 14px;
        background: #211b15;
        border-bottom: 1px solid #3a332b;
        flex-shrink: 0;
        flex-wrap: wrap;
    }
    .brand { font-size: 14px; letter-spacing: 2px; color: #f0c060; white-space: nowrap; }
    .brand span { color: #d65a3c; }
    #saveState { font-size: 11px; color: #8a7b64; white-space: nowrap; }
    .tb-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button, select, input {
        background: #2a241d;
        border: 1px solid #4a4034;
        color: #d8cbb4;
        padding: 4px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
    }
    button:hover { border-color: #d65a3c; color: #f0e6d4; }
    select:hover, input:hover { border-color: #d65a3c; }
    button.primary { background: #d65a3c; border-color: #d65a3c; color: #fff6ea; }
    button.primary:hover { background: #e06a48; color: #fff; }
    button.danger:hover { border-color: #b5432a; color: #e08070; }
    select { cursor: pointer; }
    #validateBox { padding: 3px 14px; font-size: 12px; max-height: 60px; overflow-y: auto; flex-shrink: 0; }
    #validateBox.ok { color: #8aca8a; }
    #validateBox.err { color: #e08070; background: rgba(181, 67, 42, 0.12); }
    /* ---------- 标签页 ---------- */
    #tabs {
        display: flex;
        gap: 4px;
        padding: 6px 14px 0;
        flex-shrink: 0;
    }
    #tabs button {
        border-radius: 6px 6px 0 0;
        border-bottom: none;
        padding: 5px 18px;
        background: #221c16;
    }
    #tabs button.active { background: #2e2620; color: #f0c060; }
    /* ---------- 主区 ---------- */
    #main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 8px 14px 10px; }
    .page { flex: 1; display: none; flex-direction: column; min-height: 0; gap: 8px; }
    .page.active { display: flex; }
    /* 剧本页 */
    .split { flex: 1; display: flex; gap: 10px; min-height: 0; }
    #storyText {
        flex: 1;
        background: #12100e;
        color: #e6dccb;
        border: 1px solid #3a332b;
        border-radius: 8px;
        padding: 12px 14px;
        font-family: 'Consolas', 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.8;
        resize: none;
        outline: none;
        white-space: pre;
    }
    #storyText:focus { border-color: #d65a3c; }
    .quick-bar { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .qb-label { font-size: 12px; color: #8a7b64; }
    .quick-bar button { padding: 3px 10px; font-size: 12px; }
    /* 预览 */
    #preview {
        flex: 1;
        background: linear-gradient(180deg, #1c1712, #16110d);
        border: 1px solid #3a332b;
        border-radius: 8px;
        padding: 18px 20px;
        overflow-y: auto;
        line-height: 1.9;
        font-size: 15px;
        color: #e6dccb;
    }
    #preview .chapter-title { text-align: center; font-size: 19px; color: #f0c060; letter-spacing: 5px; margin: 14px 0 20px; border-bottom: 1px solid #3a332b; padding-bottom: 12px; }
    #preview .narr-line { color: #b9ab94; margin-bottom: 8px; }
    #preview .divider { border: none; border-top: 1px solid #3a332b; margin: 12px 0; }
    #preview .msg { margin-bottom: 8px; }
    #preview .msg .speaker { font-weight: bold; margin-right: 6px; }
    #preview .clue-highlight { color: #e8b84a; font-weight: bold; padding: 0 3px; }
    #preview .note-highlight { color: #8fd0c0; font-weight: bold; padding: 0 3px; }
    #preview .char-highlight { color: #d8a8f0; font-weight: bold; padding: 0 3px; }
    #preview .slot { display: inline-block; min-width: 100px; min-height: 28px; border-bottom: 3px dashed #5a7050; margin: 0 4px; padding: 0 6px; color: #93a980; font-size: 14px; vertical-align: bottom; background: rgba(30, 44, 30, 0.35); border-radius: 0 0 4px 4px; text-align: center; }
    #preview .slot .placeholder { color: #6d8058; font-size: 12px; }
    #preview .empty-tip { color: #6d6048; font-size: 13px; padding: 20px 0; text-align: center; }
    /* 组合页 */
    #comboList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    /* 组合行 */
    #comboList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .combo-row {
        display: flex;
        gap: 8px;
        align-items: center;
        background: #1d1813;
        border: 1px solid #3a332b;
        border-radius: 8px;
        padding: 6px 10px;
        flex-wrap: wrap;
    }
    .combo-row select {
        min-width: 120px;
        background: #12100e;
        flex: 1;
    }
    .combo-row .c-op { color: #8a7b64; font-size: 13px; flex-shrink: 0; }
    .combo-row .c-del { flex-shrink: 0; }
    /* 词条页 */
    #entryList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .entry-row {
        display: flex;
        gap: 8px;
        align-items: center;
        background: #1d1813;
        border: 1px solid #3a332b;
        border-radius: 8px;
        padding: 6px 10px;
    }
    .entry-row .e-type {
        width: 44px; text-align: center; font-size: 11px; color: #f0c060;
        border: 1px solid #4a4034; border-radius: 10px; padding: 1px 0; flex-shrink: 0;
    }
    .entry-row .e-name { width: 160px; background: #12100e; }
    .entry-row .e-desc { flex: 1; background: #12100e; }
    .entry-row .e-del { flex-shrink: 0; }
    .hint-line { font-size: 12px; color: #8a7b64; flex-shrink: 0; }
    .hint-line code { color: #f0c060; background: #241e17; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="topbar">
    <span class="brand">凤尾庄 · <span>剧本编辑器</span></span>
    <select id="sceneSel" title="场景"></select>
    <button id="btnSceneUp" title="上移场景顺序">▲ 上移</button>
    <button id="btnSceneDown" title="下移场景顺序">▼ 下移</button>
    <select id="sceneBg" title="天气背景">
        <option value="cloudy">天气：阴天</option>
        <option value="rain">天气：雨天</option>
        <option value="night">天气：深夜</option>
    </select>
    <select id="sceneOwner" title="归属线路">
        <option value="wu">线路：吴秋崖</option>
        <option value="shan">线路：商难</option>
        <option value="all">线路：通用</option>
    </select>
    <select id="sceneGoto" title="完成后跳转"></select>
    <span class="tb-right">
        <span id="saveState">就绪</span>
        <button id="btnSave" title="保存到本地">保存</button>
        <button id="btnSceneAdd" title="新建场景">+ 场景</button>
        <button id="btnSceneDelete" class="danger" title="删除当前场景">删场景</button>
        <button id="btnValidate">校验</button>
        <button id="btnImport">导入 story.js</button>
        <button class="primary" id="btnExport">导出 story.js</button>
    </span>
</div>
<div id="validateBox" class="ok">就绪</div>
<div id="tabs">
    <button class="active" data-page="scene">剧本</button>
    <button data-page="combo">线索组合</button>
    <button data-page="entry">词条</button>
</div>
<div id="main">
    <!-- 剧本页 -->
    <div class="page active" id="page-scene">
        <div class="quick-bar">
            <span class="qb-label">插入标记：</span>
            <button data-tpl="title">章节标题</button>
            <button data-tpl="speaker">台词</button>
            <button data-tpl="divider">分隔线</button>
            <button data-tpl="char">人物</button>
            <button data-tpl="clue">线索</button>
            <button data-tpl="item">物品</button>
            <button data-tpl="note">笔记</button>
            <button data-tpl="slot">填空</button>
            <span class="qb-label" style="margin-left:8px">符号：</span>
            <code style="color:#8fd0c0;font-size:12px">{人:名字} {线:名字} {物:名字} {记:名字} {填:名字}</code>
        </div>
        <div class="split">
            <textarea id="storyText" spellcheck="false" placeholder="在此编写剧本：中文文本 + 符号标记。每行一个块：# 标题 / @名字: 台词 / --- 分隔线 / 普通叙述"></textarea>
            <div id="preview"><div class="empty-tip">实时预览</div></div>
        </div>
    </div>
    <!-- 组合页 -->
    <div class="page" id="page-combo">
        <div class="hint-line">每一行是一个推理组合：<b style="color:#e8decc">线索A + 线索B → 产出推理卡片</b>，可选择同时解锁笔记。笔记内容在「词条」页的笔记词条中编辑。下拉不足时可先在剧本或词条页添加。</div>
        <div id="comboList"></div>
        <div style="flex-shrink:0"><button id="btnComboAdd">＋ 新增组合</button></div>
    </div>
    <!-- 词条页 -->
    <div class="page" id="page-entry">
        <div class="hint-line">从剧本与组合中自动提取的词条（类型：人物/线索/物品/笔记/填空）。修改名称会同步替换所有场景中的引用；填空词条的描述会显示在推理结果卡片上。</div>
        <div id="entryList"></div>
    </div>
</div>
<input type="file" id="fileInput" accept=".js,.json" hidden />
<script src="compiler.js"></script>
<script>
(function () {
    'use strict';
    const LS_KEY = 'summerbird-editor-story';
    const $ = function (id) { return document.getElementById(id); };
    const TYPE_LABEL = { char: '人物', clue: '线索', item: '物品', note: '笔记', block: '填空' };

    // ---------- 编辑态数据 ----------
    let ED = null; // { startScene, scenes:[{id,owner,bg,story,goto,nextHint}], combos:[{a,b,block,note}], entries:[{type,name,desc}] }
    let currentSceneId = null;
    let saveTimer = null;

    // ---------- 初始化 ----------
    function defaultED() {
        return {
            startScene: 'scene_1',
            scenes: [{ id: 'scene_1', owner: 'wu', bg: 'cloudy', story: '# 第一章', goto: null, nextHint: '' }],
            combos: [],
            entries: []
        };
    }
    function loadED() {
        try {
            const saved = localStorage.getItem(LS_KEY);
            if (saved) {
                ED = JSON.parse(saved);
                if (ED && ED.scenes && ED.combos && ED.entries) return;
            }
        } catch (e) { /* ignore */ }
        ED = defaultED();
    }
    // ---------- 保存 ----------
    let dirty = false;
    function saveLocal() {
        try {
            localStorage.setItem(LS_KEY, JSON.stringify(ED));
            dirty = false;
            $('saveState').textContent = '✓ 已保存 ' + new Date().toLocaleTimeString();
        } catch (e) {
            $('saveState').textContent = '保存失败（存储不可用）';
        }
    }
    function markDirty() {
        dirty = true;
        $('saveState').textContent = '● 有未保存修改';
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () { saveLocal(); refreshEntries(); validate(); }, 500);
    }
    $('btnSave').addEventListener('click', function () {
        saveLocal();
        $('saveState').textContent = '✓ 已手动保存 ' + new Date().toLocaleTimeString();
    });
    window.addEventListener('beforeunload', function (e) {
        if (dirty) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    // ---------- 场景 ----------
    function getScene() {
        return ED.scenes.find(s => s.id === currentSceneId);
    }
    function renderSceneSel() {
        const sel = $('sceneSel');
        sel.innerHTML = ED.scenes.map(function (s) {
            return '<option value="' + s.id + '"' + (s.id === currentSceneId ? ' selected' : '') + '>' + escapeHtml(s.id) + '</option>';
        }).join('');
        const sc = getScene();
        if (sc) {
            $('sceneBg').value = sc.bg || 'cloudy';
            $('sceneOwner').value = sc.owner || 'wu';
            $('sceneGoto').innerHTML = '<option value="">跳转：无</option>' + ED.scenes
                .filter(s => s.id !== currentSceneId)
                .map(s => '<option value="' + s.id + '"' + (s.id === sc.goto ? ' selected' : '') + '>' + escapeHtml(s.id) + '</option>')
                .join('');
            $('storyText').value = sc.story || '';
        }
        updatePreview();
    }
    function selectScene(id) {
        if (!ED.scenes.find(s => s.id === id)) id = ED.scenes[0] ? ED.scenes[0].id : null;
        currentSceneId = id;
        renderSceneSel();
    }
    $('sceneSel').addEventListener('change', function () { selectScene(this.value); });
    function moveScene(dir) {
        const idx = ED.scenes.findIndex(s => s.id === currentSceneId);
        if (idx < 0) return;
        const to = idx + dir;
        if (to < 0 || to >= ED.scenes.length) return;
        const tmp = ED.scenes[idx];
        ED.scenes[idx] = ED.scenes[to];
        ED.scenes[to] = tmp;
        markDirty();
        renderSceneSel();
    }
    $('btnSceneUp').addEventListener('click', function () { moveScene(-1); });
    $('btnSceneDown').addEventListener('click', function () { moveScene(1); });
    $('sceneBg').addEventListener('change', function () { const sc = getScene(); if (sc) { sc.bg = this.value; markDirty(); } });
    $('sceneOwner').addEventListener('change', function () { const sc = getScene(); if (sc) { sc.owner = this.value; markDirty(); } });
    $('sceneGoto').addEventListener('change', function () { const sc = getScene(); if (sc) { sc.goto = this.value || null; markDirty(); } });
    $('storyText').addEventListener('input', function () {
        const sc = getScene();
        if (!sc) return;
        sc.story = this.value;
        markDirty();
        updatePreview();
    });
    $('btnSceneAdd').addEventListener('click', function () {
        let n = 1;
        let id = 'scene_1';
        while (ED.scenes.find(s => s.id === id)) { n++; id = 'scene_' + n; }
        const input = prompt('新场景 id（英文小写，用于跳转引用）：', id);
        if (!input || !input.trim()) return;
        const sid = input.trim();
        if (ED.scenes.find(s => s.id === sid)) { alert('id 已存在'); return; }
        ED.scenes.push({ id: sid, owner: 'wu', bg: 'cloudy', story: '# 新章节', goto: null, nextHint: '' });
        markDirty();
        selectScene(sid);
    });
    $('btnSceneDelete').addEventListener('click', function () {
        if (!currentSceneId) return;
        if (!confirm('删除场景 ' + currentSceneId + ' ？')) return;
        ED.scenes = ED.scenes.filter(s => s.id !== currentSceneId);
        ED.scenes.forEach(function (s) { if (s.goto === currentSceneId) s.goto = null; });
        if (ED.startScene === currentSceneId) ED.startScene = ED.scenes[0] ? ED.scenes[0].id : '';
        markDirty();
        selectScene(ED.scenes[0] ? ED.scenes[0].id : null);
    });

    // ---------- 快捷插入 ----------
    const QUICK_TPL = {
        title: { b: '# ', a: '', s: 3 },
        speaker: { b: '@张道诚: 「', a: '」', s: 7 },
        divider: { b: '\n---\n', a: '', s: 0 },
        char: { b: '{人:名字}', a: '文字{/}', s: 3 },
        clue: { b: '{线:名字}', a: '文字{/}', s: 3 },
        item: { b: '{物:名字}', a: '文字{/}', s: 3 },
        note: { b: '{记:名字}', a: '文字{/}', s: 3 },
        slot: { b: '{填:名字}', a: '', s: 3 }
    };
    document.querySelectorAll('.quick-bar button').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const t = QUICK_TPL[this.dataset.tpl];
            const ta = $('storyText');
            const start = ta.selectionStart;
            const end = ta.selectionEnd;
            const insert = t.b + ta.value.substring(start, end) + t.a;
            ta.value = ta.value.substring(0, start) + insert + ta.value.substring(end);
            ta.focus();
            ta.setSelectionRange(start + t.b.length + t.s, start + t.b.length + t.s);
            const sc = getScene();
            if (sc) { sc.story = ta.value; markDirty(); updatePreview(); }
        });
    });

    // ---------- 预览 ----------
    function entryIds() {
        const ids = { clues: {}, items: {}, notes: {}, characters: {} };
        ED.entries.forEach(function (e) {
            if (e.type === 'clue') ids.clues[e.name] = { name: e.name, desc: e.desc };
            else if (e.type === 'item') ids.items[e.name] = { name: e.name, desc: e.desc };
            else if (e.type === 'note') ids.notes[e.name] = { name: e.name, desc: e.desc };
            else if (e.type === 'char') ids.characters[e.name] = { name: e.name };
        });
        return ids;
    }
    function updatePreview() {
        const sc = getScene();
        const pre = $('preview');
        if (!sc) { pre.innerHTML = '<div class="empty-tip">暂无场景</div>'; return; }
        const ids = entryIds();
        const compiled = SBCompiler.compileScenes([sc], {
            speakers: { wu: '吴秋崖', shan: '商难', old: '张道诚', zhang: '张泽平' },
            ids: { char: ids.characters, clue: Object.assign({}, ids.clues, ids.items), note: ids.notes }
        });
        const cs = compiled.scenes[sc.id];
        pre.innerHTML = cs ? cs.story.split('\n').map(s => s.trim()).filter(Boolean).join('') :
            '<div class="empty-tip">编译失败</div>';
    }

    // ---------- 词条提取 ----------
    function scanEntries() {
        // 基于已有词条去重：只补缺失的，绝不重复累加
        function add(type, name) {
            if (!name || !name.trim()) return;
            const n = name.trim();
            if (!ED.entries.some(function (e) { return e.type === type && e.name === n; })) {
                ED.entries.push({ type: type, name: n, desc: '' });
            }
        }
        const charRe = /\{人:([^}]+)\}/g;
        const clueRe = /\{线:([^}]+)\}/g;
        const itemRe = /\{物:([^}]+)\}/g;
        const noteRe = /\{记:([^}]+)\}/g;
        const slotRe = /\{填:([^}]+)\}/g;
        ED.scenes.forEach(function (sc) {
            const text = sc.story || '';
            let m;
            while ((m = charRe.exec(text))) add('char', m[1]);
            while ((m = clueRe.exec(text))) add('clue', m[1]);
            while ((m = itemRe.exec(text))) add('item', m[1]);
            while ((m = noteRe.exec(text))) add('note', m[1]);
            while ((m = slotRe.exec(text))) add('block', m[1]);
        });
        ED.combos.forEach(function (c) {
            add('clue', c.a);
            add('clue', c.b);
            if (c.block) add('block', c.block);
            if (c.note) add('note', c.note);
        });
    }
    function refreshEntries() {
        scanEntries();
        renderEntries();
    }
    function renderEntries() {
        const list = $('entryList');
        const PLACEHOLDER = {
            note: '笔记内容（解锁后查看）',
            block: '推理结果卡片内容',
            char: '人物描述（可空）',
            clue: '线索描述（可空）',
            item: '物品描述（可空）'
        };
        if (ED.entries.length === 0) {
            list.innerHTML = '<div class="hint-line">暂无词条——在剧本中用 {人:} {线:} {物:} {记:} {填:} 标记，或先写线索组合</div>';
            return;
        }
        list.innerHTML = '';
        ED.entries.forEach(function (e, idx) {
            const row = document.createElement('div');
            row.className = 'entry-row';
            row.innerHTML = '<span class="e-type">' + TYPE_LABEL[e.type] + '</span>' +
                '<input class="e-name" value="' + escapeHtml(e.name) + '" />' +
                '<input class="e-desc" value="' + escapeHtml(e.desc || '') + '" placeholder="' + PLACEHOLDER[e.type] + '" />' +
                '<button class="e-del danger">删除</button>';
            list.appendChild(row);
            const nameInput = row.querySelector('.e-name');
            nameInput.addEventListener('change', function () {
                const old = e.name;
                const neu = this.value.trim();
                if (!neu || neu === old) { this.value = old; return; }
                // 全局替换所有引用（词条名、场景文本符号、组合、奖励文本）
                replaceName(old, neu);
                markDirty();
            });
            row.querySelector('.e-desc').addEventListener('input', function () {
                e.desc = this.value;
                markDirty();
            });
            row.querySelector('.e-del').addEventListener('click', function () {
                ED.entries.splice(idx, 1);
                renderEntries();
                markDirty();
            });
        });
    }
    function replaceName(oldName, newName) {
        ED.scenes.forEach(function (sc) {
            sc.story = sc.story.split(oldName).join(newName);
        });
        ED.combos.forEach(function (c) {
            if (c.a === oldName) c.a = newName;
            if (c.b === oldName) c.b = newName;
            if (c.block === oldName) c.block = newName;
            if (c.note === oldName) c.note = newName;
        });
        ED.entries.forEach(function (e) { if (e.name === oldName) e.name = newName; });
        refreshEntries();
    }

    // ---------- 组合（下拉行式） ----------
    function clueEntries() { return ED.entries.filter(function (e) { return e.type === 'clue' || e.type === 'item'; }); }
    function blockEntries() { return ED.entries.filter(function (e) { return e.type === 'block'; }); }
    function noteEntries() { return ED.entries.filter(function (e) { return e.type === 'note'; }); }
    function selOptions(field, entries, current) {
        let html = '<select data-f="' + field + '"><option value="">（空）</option>';
        entries.forEach(function (e) {
            html += '<option value="' + escapeHtml(e.name) + '"' + (e.name === current ? ' selected' : '') + '>' + escapeHtml(e.name) + '</option>';
        });
        if (current && !entries.find(function (e) { return e.name === current; })) {
            html += '<option value="' + escapeHtml(current) + '" selected>' + escapeHtml(current) + '（词条缺失）</option>';
        }
        html += '</select>';
        return html;
    }
    function renderComboRows() {
        const list = $('comboList');
        list.innerHTML = '';
        if (ED.combos.length === 0) {
            list.innerHTML = '<div class="hint-line">暂无组合——点击下方「＋ 新增组合」开始</div>';
            return;
        }
        ED.combos.forEach(function (c, idx) {
            const row = document.createElement('div');
            row.className = 'combo-row';
            row.innerHTML =
                '<span class="c-op">线索</span>' + selOptions('a', clueEntries(), c.a) +
                '<span class="c-op">＋</span>' + selOptions('b', clueEntries(), c.b) +
                '<span class="c-op">→</span>' + selOptions('block', blockEntries(), c.block) +
                '<span class="c-op">解锁笔记</span>' + selOptions('note', noteEntries(), c.note) +
                '<button class="c-del danger">删除</button>';
            list.appendChild(row);
            row.querySelectorAll('select').forEach(function (sel) {
                sel.addEventListener('change', function () {
                    const v = this.value || '';
                    if (this.dataset.f === 'a') c.a = v;
                    else if (this.dataset.f === 'b') c.b = v;
                    else if (this.dataset.f === 'block') c.block = v;
                    else c.note = v;
                    markDirty();
                });
            });
            row.querySelector('.c-del').addEventListener('click', function () {
                ED.combos.splice(idx, 1);
                renderComboRows();
                markDirty();
            });
        });
    }
    $('btnComboAdd').addEventListener('click', function () {
        ED.combos.push({ a: '', b: '', block: '', note: '' });
        renderComboRows();
        markDirty();
    });

    // ---------- 标签页 ----------
    document.querySelectorAll('#tabs button').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.remove('active'); });
            this.classList.add('active');
            document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
            $('page-' + this.dataset.page).classList.add('active');
            if (this.dataset.page === 'entry') refreshEntries();
            if (this.dataset.page === 'combo') renderComboRows();
        });
    });

    // ---------- 校验 ----------
    function validate() {
        const errors = [];
        const warnings = [];
        scanEntries();
        const names = {};
        ED.entries.forEach(function (e) { names[e.type + '@' + e.name] = true; });
        // 场景
        const sceneIds = new Set(ED.scenes.map(s => s.id));
        if (ED.startScene && !sceneIds.has(ED.startScene)) errors.push('起始场景不存在: ' + ED.startScene);
        ED.scenes.forEach(function (sc) {
            if (!sc.id) errors.push('存在无 id 的场景');
            if (sc.goto && !sceneIds.has(sc.goto)) errors.push('[' + sc.id + '] 跳转到不存在的场景: ' + sc.goto);
            const slotRe = /\{填:([^}]+)\}/g;
            let m;
            while ((m = slotRe.exec(sc.story || ''))) {
                const name = m[1].trim();
                const hasCard = ED.combos.some(c => c.block === name) ||
                    names['char@' + name] || names['item@' + name] || names['clue@' + name];
                if (!hasCard) warnings.push('[' + sc.id + '] 填空「' + name + '」没有任何卡片可产出（需组合产出或人物/物品/线索卡）');
            }
            const charRe = /\{人:([^}]+)\}/g;
            while ((m = charRe.exec(sc.story || ''))) {
                if (!names['char@' + m[1].trim()]) errors.push('[' + sc.id + '] 人物词条缺失: ' + m[1]);
            }
        });
        // 组合
        ED.combos.forEach(function (c) {
            if (!names['clue@' + c.a] && !names['item@' + c.a]) errors.push('组合线索不存在: ' + c.a);
            if (!names['clue@' + c.b] && !names['item@' + c.b]) errors.push('组合线索不存在: ' + c.b);
            if (c.block && !names['block@' + c.block]) errors.push('组合产出卡未使用或缺失: ' + c.block);
            if (c.note && !names['note@' + c.note]) errors.push('组合笔记不存在: ' + c.note);
        });
        const box = $('validateBox');
        box.className = errors.length ? 'err' : 'ok';
        const lines = [].concat(
            errors.map(function (e) { return '✗ ' + e; }),
            warnings.map(function (w) { return '⚠ ' + w; })
        );
        box.textContent = lines.length ? lines.join('；') :
            '✓ 通过：' + ED.scenes.length + ' 场景 / ' + ED.combos.length + ' 组合 / ' + ED.entries.length + ' 词条';
    }
    $('btnValidate').addEventListener('click', validate);

    // ---------- 导出（ED → 游戏 story.js） ----------
    function exportStory() {
        scanEntries();
        const data = { clues: {}, items: {}, notes: {}, characters: {} };
        ED.entries.forEach(function (e) {
            if (e.type === 'clue') data.clues[e.name] = { name: e.name, desc: e.desc || '' };
            else if (e.type === 'item') data.items[e.name] = { name: e.name, desc: e.desc || '' };
            else if (e.type === 'note') data.notes[e.name] = { name: e.name, detail: e.desc || '' };
            else if (e.type === 'char') data.characters[e.name] = { name: e.name, role: '', desc: e.desc || '', info: '' };
        });
        const combinations = {};
        ED.combos.forEach(function (c) {
            if (!c.a || !c.b) return;
            const key = [c.a, c.b].sort().join('+');
            const entry = {};
            if (c.note) entry.noteId = c.note;
            if (c.block) {
                const be = ED.entries.find(x => x.type === 'block' && x.name === c.block);
                entry.block = { id: c.block, label: c.block, detail: be ? be.desc : '' };
            }
            combinations[key] = entry;
        });
        const scenes = ED.scenes.map(function (sc) {
            const slotRe = /\{填:([^}]+)\}/g;
            const refs = [];
            let m;
            while ((m = slotRe.exec(sc.story || ''))) {
                if (refs.indexOf(m[1].trim()) === -1) refs.push(m[1].trim());
            }
            const initBlocks = refs.map(function (name) {
                const be = ED.entries.find(x => x.type === 'block' && x.name === name);
                return { id: name, type: 'reason', label: name, detail: be ? be.desc : '', owner: 'all' };
            });
            return {
                id: sc.id,
                owner: sc.owner || 'wu',
                bg: sc.bg || 'cloudy',
                story: sc.story || '',
                initBlocks: initBlocks,
                goto: sc.goto || null,
                nextHint: sc.nextHint || ''
            };
        });
        return {
            startScene: ED.scenes[0] ? ED.scenes[0].id : '', // 列表第一个场景即起始场景
            speakers: { wu: '吴秋崖', shan: '商难', old: '张道诚', zhang: '张泽平' },
            data: data,
            combinations: combinations,
            scenes: scenes
        };
    }
    $('btnExport').addEventListener('click', function () {
        validate();
        const story = exportStory();
        const content = '/*\n * 由编辑器导出的游戏数据\n */\nwindow.__STORY__ = ' + JSON.stringify(story, null, 4) + ';\n';
        const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'story.js';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        $('saveState').textContent = '已导出 story.js（下载后替换游戏目录中的文件）';
    });

    // ---------- 导入（游戏 story.js → ED） ----------
    function importStory(story) {
        ED = { startScene: story.startScene || '', scenes: [], combos: [], entries: [] };
        // 词条
        const data = story.data || {};
        Object.keys(data.clues || {}).forEach(function (k) { ED.entries.push({ type: 'clue', name: data.clues[k].name || k, desc: data.clues[k].desc || '' }); });
        Object.keys(data.items || {}).forEach(function (k) { ED.entries.push({ type: 'item', name: data.items[k].name || k, desc: data.items[k].desc || '' }); });
        Object.keys(data.notes || {}).forEach(function (k) { ED.entries.push({ type: 'note', name: data.notes[k].name || k, desc: data.notes[k].detail || '' }); });
        Object.keys(data.characters || {}).forEach(function (k) { ED.entries.push({ type: 'char', name: data.characters[k].name || k, desc: data.characters[k].desc || '' }); });
        // 组合
        Object.keys(story.combinations || {}).forEach(function (key) {
            const combo = story.combinations[key];
            const parts = key.split('+');
            const a = nameOf(parts[0], data);
            const b = nameOf(parts[1], data);
            ED.combos.push({ a: a, b: b, block: combo.block ? combo.block.label : '', note: combo.noteId ? nameOf(combo.noteId, data, 'note') : '' });
        });
        // 场景：符号转换
        (story.scenes || []).forEach(function (sc) {
            ED.scenes.push({
                id: sc.id,
                owner: sc.owner || 'wu',
                bg: sc.bg || 'cloudy',
                story: convertStoryText(sc.story || '', data, sc.initBlocks),
                goto: sc.goto || null,
                nextHint: sc.nextHint || ''
            });
        });
    }
    function nameOf(id, data, kind) {
        if (!kind) {
            if (data.clues && data.clues[id]) return data.clues[id].name;
            if (data.items && data.items[id]) return data.items[id].name;
            if (data.notes && data.notes[id]) return data.notes[id].name;
            return id;
        }
        const d = data[kind] || {};
        return d[id] ? d[id].name : id;
    }
    function convertStoryText(text, data, initBlocks) {
        let t = text.replace(/\{c:([^{}]+)\}([\s\S]*?)\{\/\}/g, function (all, id, content) {
            return '{人:' + nameOf(id, data, 'characters') + '}' + content + '{/}';
        });
        t = t.replace(/\{k:([^{}]+)\}([\s\S]*?)\{\/\}/g, function (all, id, content) {
            const kind = data.items && data.items[id] ? '物' : '线';
            return '{' + kind + ':' + nameOf(id, data) + '}' + content + '{/}';
        });
        t = t.replace(/\{n:([^{}]+)\}([\s\S]*?)\{\/\}/g, function (all, id, content) {
            return '{记:' + nameOf(id, data, 'notes') + '}' + content + '{/}';
        });
        t = t.replace(/【填空:([^】]+)】/g, function (all, ref) {
            const b = (initBlocks || []).find(x => x.id === ref);
            return '{填:' + (b ? b.label : ref) + '}';
        });
        return t;
    }
    $('btnImport').addEventListener('click', function () { $('fileInput').click(); });
    $('fileInput').addEventListener('change', function () {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function () {
            try {
                const parsed = JSON.parse(String(reader.result).replace(/^[\s\S]*?=\s*/, '').replace(/;\s*$/, ''));
                if (!parsed.scenes || !parsed.data) throw new Error('不是有效的 story 数据');
                importStory(parsed);
                saveLocal();
                selectScene(ED.startScene || (ED.scenes[0] && ED.scenes[0].id));
                renderComboRows();
                refreshEntries();
                validate();
                $('saveState').textContent = '已导入 ' + file.name;
            } catch (e) {
                alert('导入失败：' + e.message);
            }
        };
        reader.readAsText(file, 'utf-8');
        this.value = '';
    });

    // ---------- 工具 ----------
    function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ---------- 启动 ----------
    loadED();
    renderSceneSel();
    renderComboRows();
    refreshEntries();
    validate();

    // 调试/集成钩子
    window.SBEditor = {
        loadED: function (ed) {
            ED = ed;
            currentSceneId = ed.scenes && ed.scenes[0] ? ed.scenes[0].id : null;
            renderSceneSel();
            renderComboRows();
            refreshEntries();
            validate();
        },
        exportStory: exportStory,
        getED: function () { return ED; }
    };
})();
</script>
